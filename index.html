<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10151a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Reading Log</title>
<style>
:root{--ink:#10151a;--raised:#182028;--line:#2a3441;--parchment:#e6ebef;--muted:#8b98a5;--brass:#89b7d6;--rust:#c05c56;
 --ghost:#475462;--daynum:#4d5a67;--outnum:#232b33;--rustdeep:#8c3530;
 --pipline:rgba(230,235,239,.2);--piptext:rgba(230,235,239,.3);
 --pipinvline:rgba(16,21,26,.35);--pipinvtext:rgba(16,21,26,.45);--track:#10151a}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--parchment);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0 0}
#app{max-width:620px;margin:0 auto;padding:22px 18px 48px}
.serif{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif}
a{color:var(--brass)}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h1{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:30px;font-weight:600;margin:0;line-height:1.05}
.count{text-align:right;line-height:1.1;flex-shrink:0}
.count b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:28px;color:var(--brass);display:block;font-weight:400}
.count span{font-size:11px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
 font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button.on{color:var(--brass);border-bottom-color:var(--brass)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{font-size:15px;font-weight:600}
.link{background:none;border:none;color:var(--brass);font-size:12px;padding:4px 0 0;cursor:pointer}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
 background:transparent;color:var(--parchment);font-size:16px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.3}
.stepper span{font-size:11px;color:var(--muted);min-width:52px;text-align:center}
.assign{margin:16px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.assign .ref{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:27px;color:var(--brass);line-height:1.15}
.assign .meta{font-size:12px;color:var(--muted);margin-top:5px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.35}
textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
 font-size:16px;line-height:1.5;padding:10px 11px;resize:vertical;min-height:76px;
 font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif}
textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
textarea::placeholder{color:var(--ghost)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-size:12px;color:var(--muted);min-height:16px;line-height:1.4}
.status.err{color:var(--rust)}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
 flex-shrink:0;font-variant-numeric:tabular-nums}
.pill.on{color:var(--ink);background:var(--brass);border-color:var(--brass);font-weight:600}
.sechead{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.big{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 4px}
.big .pct{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .grade{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:44px;line-height:1;color:var(--brass)}
.big .grade.off{color:var(--line)}
.sub{font-size:13px;color:var(--muted);line-height:1.45}
.bar{position:relative;height:6px;background:var(--track);border-radius:3px;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
.bar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--parchment)}
.verdict{font-size:12px;color:var(--muted)}
.verdict.on{color:var(--brass)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0 12px}
.mgrid>span{aspect-ratio:1;border-radius:5px;font-size:11px;display:flex;align-items:center;justify-content:center;
 font-variant-numeric:tabular-nums;border:1px solid var(--line);color:var(--daynum);position:relative;padding-bottom:9px}
.mgrid>span.complete{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.mgrid>span.partial{border-color:var(--brass);color:var(--brass)}
.mgrid>span.out{border-color:transparent;color:var(--outnum);padding-bottom:0}
.mgrid>span.blank{border-color:transparent;padding-bottom:0}
.mgrid>span .pd{position:absolute;top:3px;right:4px;font-size:9px;line-height:1;font-weight:500;color:var(--muted);opacity:.85}
.mgrid>span.partial .pd{color:var(--brass)}
.mgrid>span.complete .pd{color:var(--ink);opacity:.7}
.legend .pdeg{font-size:8px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 3px;margin-right:4px}
.mgrid.dowrow{margin:16px 0 0}
.mgrid.cal{margin-top:6px}
.mgrid>span.dh{aspect-ratio:auto;border:none;padding:0;color:var(--muted);font-size:10px;letter-spacing:.08em;opacity:.75}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav .eyebrow{margin-bottom:0}
.mnav button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:transparent;
 color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
.mnav button:disabled{opacity:.25}
.pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.pip{width:11px;height:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
 font-size:7px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 border:1px solid var(--pipline);color:var(--piptext)}
.pip.ok{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.pip.no{background:var(--rust);border-color:var(--rust);color:var(--parchment)}
.mgrid>span.complete .pip{border-color:var(--pipinvline);color:var(--pipinvtext)}
.mgrid>span.complete .pip.ok{background:var(--ink);border-color:var(--ink);color:var(--brass)}
.mgrid>span.complete .pip.no{background:var(--rustdeep);border-color:var(--rustdeep);color:var(--parchment)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.sw.c{background:var(--brass);border-color:var(--brass)}
.sw.p{border-color:var(--brass)}
.weekrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:block}
.dots i.complete{background:var(--brass);border-color:var(--brass)}
.dots i.partial{border-color:var(--brass)}
.wnum{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
.wnum small{font-size:13px;color:var(--muted);margin-left:8px}
.wnum small.on{color:var(--brass)}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-left:2px solid var(--line);padding-left:9px;line-height:1.45}
.totals{display:flex;justify-content:space-between;gap:10px}
.totals b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:26px;color:var(--brass);
 line-height:1.1;display:block;font-weight:400}
.totals span{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.row{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:baseline;width:100%;text-align:left;
 background:none;border:none;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;color:var(--parchment)}
.row .d{font-size:12px;color:var(--muted)}
.row .r{font-size:13px;color:var(--brass);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .m{font-size:11px;color:var(--muted);text-align:right}
.row .m.on{color:var(--brass)}
.mrow{display:grid;grid-template-columns:1fr 52px 60px 34px;gap:8px;align-items:baseline;
 border-bottom:1px solid var(--line);padding:11px 2px}
.mrow .n{font-size:13px}
.mrow .f,.mrow .p{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mrow .p.on{color:var(--brass)}
.mrow .g{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:16px;color:var(--brass);text-align:right}
.actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:104px;padding:11px 12px;border-radius:8px;border:1px solid var(--brass);
 background:transparent;color:var(--brass);font-size:13px;cursor:pointer}
.actions button.quiet{border-color:var(--line);color:var(--muted)}
.foot{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
.hidden{display:none}
.tok{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
 font-size:14px;padding:10px 11px;margin-top:4px}
.tok:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.themes{position:fixed;right:14px;top:76px;width:176px;background:var(--raised);border:1px solid var(--line);
 border-radius:10px;padding:10px;z-index:50;max-height:calc(100vh - 100px);overflow-y:auto}
.themes h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
 font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.themes h3 span{cursor:pointer;text-decoration:underline;font-weight:400;letter-spacing:0;text-transform:none}
.throw{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;border-radius:7px;
 padding:7px 8px;cursor:pointer;font-size:12px;text-align:left;margin-bottom:4px}
.throw.on{box-shadow:0 0 0 2px var(--brass)}
.thsw{display:flex;gap:3px;flex:none}
.thsw i{width:12px;height:12px;border-radius:4px;display:block}
.thrand{display:block;width:100%;margin-bottom:8px;padding:8px 10px;border-radius:7px;border:1px dashed var(--brass);
 background:transparent;color:var(--brass);font-size:12px;letter-spacing:.04em;cursor:pointer}
.thgrp{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;
 color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 4px 6px;cursor:pointer}
.thgrp i{font-style:normal;font-size:10px;opacity:.7}
.thgrp .arr{font-weight:400}
.thgbody{display:none}
.thgbody.open{display:block}
.themes.min .throw,.themes.min .thrand,.themes.min .thgrp,.themes.min .thgbody{display:none}
.themes.min{max-height:none;overflow:visible}
.themes.min h3{margin-bottom:0}
.expbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;
 gap:14px;background:var(--rust);color:var(--parchment);font-size:13px;padding:10px 44px 10px 14px;line-height:1.45;
 text-align:center}
.expbar button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
 color:var(--parchment);font-size:20px;cursor:pointer;line-height:1;padding:6px}
@media (max-width:1080px){
 .themes{left:12px;right:12px;top:auto;bottom:12px;width:auto;display:flex;flex-wrap:wrap;gap:4px;max-height:36vh}
 .themes h3{width:100%;margin-bottom:4px}
 .throw{width:auto;flex:1 1 40%;margin-bottom:0}
}
.lock{min-height:76vh;display:flex;align-items:center;justify-content:center}
.lockcard{width:100%;max-width:300px;text-align:center}
.lockcard h1{margin-bottom:22px}
.lockcard input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:8px;
 color:var(--parchment);font-size:18px;padding:12px;text-align:center;letter-spacing:.12em}
.lockcard input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.lockcard button{width:100%;margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--brass);
 background:transparent;color:var(--brass);font-size:14px;letter-spacing:.06em;cursor:pointer}
.lockmsg{font-size:12px;color:var(--rust);min-height:16px;margin-top:10px}
.pmwrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
 margin:2px 0 14px;padding:12px 2px 0;border-top:1px solid var(--line)}
.pmhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost)}
.pmset{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pmitem{display:flex;align-items:center;gap:7px}
.pmlab{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--ghost);font-size:12px;padding:5px 13px;cursor:pointer;
 letter-spacing:.03em;transition:background .15s,color .15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.sel{font-weight:600}
.seg button.sel[data-g="1"]{background:var(--brass);color:var(--ink)}
.seg button.sel[data-g="0"]{background:var(--rust);color:var(--parchment)}
.seg button.sel[data-g="x"]{background:var(--line);color:var(--parchment)}
.pmwrap+.pmwrap{margin-top:-6px}
.trows{margin:8px 0 2px}
.trow{display:grid;grid-template-columns:58px 1fr 50px 28px;gap:10px;align-items:center;padding:6px 0}
.tlab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trow .bar{margin:0;height:5px}
.trow .bar u{height:11px;top:-3px}
.tpct{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tgr{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px;color:var(--brass);text-align:right}
.bar i.alt{background:var(--parchment)}
.weekrow .tlab{width:58px;flex:none}
.weekrow .dots{margin-right:auto}
.weekrow{padding:5px 0}
.weekrow .wnum{font-size:17px;min-width:66px;text-align:right}
.dots i.fail{background:var(--rust);border-color:var(--rust)}
.arow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;
 border-bottom:1px solid var(--line)}
.arow .det{font-size:12px;color:var(--muted)}
.apct{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:18px;color:var(--parchment)}
.apct.on{color:var(--brass)}
.nstages{margin-top:12px}
.nstages li{font-size:13px;line-height:1.45;color:var(--muted)}
.nstages li::marker{color:var(--brass)}
.kegsub b{color:var(--parchment);font-weight:600}
.mscroll{overflow-x:auto}
.mscroll .mrow4{min-width:430px}
.mrow4{display:grid;grid-template-columns:1fr repeat(7,46px);gap:3px;align-items:baseline;
 border-bottom:1px solid var(--line);padding:11px 2px}
.mrow4 .n{font-size:13px}
.mrow4 .p{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow4 .p.on{color:var(--brass)}
.mrow4 .p b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:13px;font-weight:400;
 color:var(--brass);margin-left:3px}
.apct b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px;font-weight:400;
 color:var(--brass);margin-left:7px}
.mrow4.hd{border-bottom:none;padding:0 2px 2px}
.mrow4.hd span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.xc{margin:4px 0 16px;padding:13px 14px;border:1px dashed var(--brass);border-radius:10px}
.xc.done{border-style:solid}
.goal{margin:4px 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--track)}
.goal.read{border-color:var(--brass)}
.goaltag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.goal.read .goaltag{color:var(--brass)}
.goaltext{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:17px;line-height:1.4;margin:8px 0 10px;color:var(--parchment)}
.goalbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:5px 13px;font-size:12px;cursor:pointer;letter-spacing:.03em}
.goal.read .goalbtn{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.goals{margin:6px 0 0;padding-left:26px}
.goals li{padding:8px 0 8px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.goals li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.goals li.today{color:var(--brass)}
.goals li small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-left:6px}
.enc{margin:4px 0 16px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:10px;background:var(--track)}
.enctext{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:16px;line-height:1.5;margin:8px 0 6px;color:var(--parchment);white-space:pre-line}
.encby{font-size:12px;color:var(--muted);text-align:right}
.qcat{margin:18px 0 0}
.qcat:first-of-type{margin-top:6px}
.quotes li .qt{display:block;white-space:pre-line;font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px;line-height:1.5}
.quotes li .qa{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.quotes li.today .qt{color:var(--brass)}
.gedit{min-height:340px;font-size:14px;line-height:1.5}
.grow{display:flex;gap:14px;align-items:center;margin-top:12px}
.gbtn{background:var(--brass);color:var(--ink);border:none;border-radius:16px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
.gbtn:disabled{opacity:.4;cursor:default}
.myqform{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px}
.myqform .grow{margin-top:2px}
textarea.myq{min-height:96px;font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px}
.myqby{width:100%;max-width:320px;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
 font-size:13px;padding:7px 10px}
.myqby:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.myqby::placeholder{color:var(--ghost)}
.myqlist{margin-top:14px}
.quotes li .qact{display:flex;gap:16px;margin-top:2px}
.quotes li.editing{opacity:.5}
.link.danger{color:var(--rust);font-weight:600}
.mgrid>span .tl{position:absolute;top:3px;left:4px;display:flex;gap:3px}
.mgrid>span .gm{font-size:9px;line-height:1;font-weight:700;color:var(--ghost)}
.mgrid>span .gm.off{text-decoration:line-through;opacity:.6}
.mgrid>span .gm.ok{color:var(--brass)}
.mgrid>span .gm.no{color:var(--rust)}
.mgrid>span.complete .gm{color:var(--ink);opacity:.55}
.mgrid>span.complete .gm.ok{opacity:1}
.mgrid>span.complete .gm.no{color:var(--rustdeep);opacity:1}
.legend .gmeg{font-size:9px;font-weight:700;color:var(--brass);margin-right:4px}
.mgrid>span.ed{cursor:pointer}
.mgrid>span.ed:hover,.mgrid>span.ed:focus-visible,.mgrid>span.pick{outline:2px solid var(--parchment);outline-offset:1px}
.calsheet{margin:0 0 14px;padding:12px 14px;border:1px solid var(--brass);border-radius:10px;background:var(--track)}

function buildThemePanel(){
  var box = document.createElement("div");
  box.className = "themes min";
  var groups = [];
  THEMES.forEach(function(t){ if(groups.indexOf(t.group) < 0) groups.push(t.group); });
  var h = '<h3>Try a look <span id="thHide">show</span></h3>'+
          '<button class="thrand" id="thRand">Pick a rando</button>';
  groups.forEach(function(g){
    var items = '', count = 0;
    THEMES.forEach(function(t,i){
      if(t.group !== g) return;
      count++;
      items += '<button class="throw" data-i="'+i+'" style="background:'+t.raised+';color:'+t.parchment+
               ';border-color:'+t.line+'">'+
               '<span class="thsw"><i style="background:'+t.brass+'"></i><i style="background:'+t.rust+'"></i>'+
               '<i style="background:'+t.parchment+'"></i></span>'+esc(t.name)+'</button>';
    });
    h += '<button class="thgrp" data-g="'+esc(g)+'"><span><b class="arr">&#9656;</b> '+esc(g)+'</span><i>'+count+'</i></button>'+
         '<div class="thgbody" data-g="'+esc(g)+'">'+items+'</div>';
  });
  box.innerHTML = h;
  document.body.appendChild(box);

  function openGroup(g){
    box.querySelectorAll(".thgbody").forEach(function(d){ d.classList.toggle("open", d.dataset.g === g); });
    box.querySelectorAll(".thgrp").forEach(function(btn){
      btn.querySelector(".arr").innerHTML = btn.dataset.g === g ? "&#9662;" : "&#9656;";
    });
  }
  box.querySelectorAll(".thgrp").forEach(function(btn){
    btn.onclick = function(){
      var open = box.querySelector('.thgbody.open[data-g="'+btn.dataset.g+'"]');
      openGroup(open ? "" : btn.dataset.g);
    };
  });
  box.querySelectorAll(".throw").forEach(function(b){
    b.onclick = function(){
      var i = Number(b.dataset.i);
      try { localStorage.setItem(THEME_KEY, String(i)); } catch(e){}
      applyTheme(i);
    };
  });
  var hideBtn = document.getElementById("thHide");
  hideBtn.onclick = function(){
    box.classList.toggle("min");
    hideBtn.textContent = box.classList.contains("min") ? "show" : "hide";
  };
  document.getElementById("thRand").onclick = function(){
    var i = curThemeIdx;
    while(i === curThemeIdx) i = Math.floor(Math.random()*THEMES.length);

/* ---------- sync (private GitHub repo) ---------- */
var SYNC_REPO = "matthewsb419/dailybiblereading-data";
var SYNC_URL = "https://api.github.com/repos/"+SYNC_REPO+"/contents/data.json";
var TOKEN_KEY = "bibleLog.ghtoken";
var TOKEN_EXPIRES = "2026-12-04"; // update this date whenever a new token is created
var syncSha = null, pushTimer = null, syncOpen = false, syncBusy = false, syncHelpOpen = false;

function ghToken(){ try { return localStorage.getItem(TOKEN_KEY) || ""; } catch(e){ return ""; } }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\n/g,"")))); }
function setSyncStatus(msg, err){ statusMsg = msg; statusErr = !!err; paintStatus(); }

function mergeRemote(remote){
  // per entry, the most recently edited copy wins
  var changed = false;
  if(remote && remote.entries){
    Object.keys(remote.entries).forEach(function(k){
      var mine = state.entries[k], theirs = remote.entries[k];
      if(!mine || (theirs.savedAt||"") > (mine.savedAt||"")){ state.entries[k] = theirs; changed = true; }
    });
  }
  if(remote && remote.goals && remote.goals.length &&
     (!(state.goals||[]).length || (remote.goalsSavedAt||"") > (state.goalsSavedAt||""))){
    if(JSON.stringify(remote.goals) !== JSON.stringify(state.goals||[])){
      state.goals = remote.goals; state.goalsSavedAt = remote.goalsSavedAt; changed = true;
    }
  }
  if(remote && remote.marks && mergeMarks(remote.marks)) changed = true;
  if(remote && remote.myQuotes && mergeMyQuotes(remote.myQuotes)) changed = true;
  return changed;
}

function syncNow(manual){
  if(!ghToken() || syncBusy || typeof fetch === "undefined") return;
  syncBusy = true;
  if(manual) setSyncStatus("Syncing…");
  var hdrs = {Authorization:"Bearer "+ghToken(), Accept:"application/vnd.github+json"};
  fetch(SYNC_URL, {headers:hdrs})
  .then(function(r){
    if(r.status === 404){ syncSha = null; return null; }
    if(r.status === 401) throw new Error("GitHub says the token is invalid — re-copy the exact github_pat value and paste it again");
    if(r.status === 403) throw new Error("token lacks permission — set Contents to Read and write on the data repo");
    if(!r.ok) throw new Error("pull failed ("+r.status+")");
    return r.json();
  })
  .then(function(j){
    var remoteText = "";
    if(j){
      syncSha = j.sha;
      remoteText = b64dec(j.content);
      var changed = false;
      try { changed = mergeRemote(JSON.parse(remoteText)); } catch(e){}
      if(changed){
        if(page === "today" && !document.querySelector("textarea:focus,input:focus")) viewDay = currentDay();
        save(); render();
      }
    }
    var localText = JSON.stringify(state);
    if(localText === remoteText){ syncBusy = false; setSyncStatus("Synced"); return null; }
    var body = {message:"sync "+new Date().toISOString(), content:b64enc(localText)};
    if(syncSha) body.sha = syncSha;
    return fetch(SYNC_URL, {method:"PUT", headers:hdrs, body:JSON.stringify(body)})
      .then(function(r){
        if(r.status === 409 || r.status === 422){ syncBusy = false; syncSha = null; syncNow(manual); return null; }
        if(r.status === 404 || r.status === 403) throw new Error("token can't write the data repo — grant it access to "+SYNC_REPO+" with Contents read and write");
        if(!r.ok) throw new Error("push failed ("+r.status+")");
        return r.json();
      })
      .then(function(j2){
        if(j2){ if(j2.content) syncSha = j2.content.sha; syncBusy = false; setSyncStatus("Synced"); }
      });
  })
  .catch(function(e){ syncBusy = false; setSyncStatus("Sync: "+e.message, true); });
}
function schedulePush(){
  if(!ghToken()) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = null; syncNow(false); }, 2500);
}

function gateHash(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))>>>0; }
  return h.toString(36);
}
function isUnlocked(){
  // session-only: the password is asked on every fresh launch
  try { localStorage.removeItem(GATE_KEY); } catch(e){}
  try { return sessionStorage.getItem(GATE_KEY) === GATE_HASH; } catch(e){ return false; }
}

function ecOffset(dateKey){
  return Math.round((asDate(dateKey) - asDate(EC_START))/86400000);
}
function ecBank(ch){ return EC_QUESTIONS[ch-1] || []; }
function ecFor(dateKey){
  // what the extra credit is on a given calendar date, or null if outside the run
  if(!dateKey || dateKey < EC_START || dateKey > EC_END) return null;
  var n = ecOffset(dateKey);
  if(n < 0) return null;
  var ch = (n % EC_CYCLE) + 1;
  var cycle = Math.floor(n / EC_CYCLE);
  var bank = ecBank(ch);
  if(!bank.length) return null;
  var qi = cycle % bank.length;
  return {n:n, ch:ch, cycle:cycle, qi:qi, q:bank[qi],
          ref:"1 Timothy "+ch, week:Math.floor(n/7)+1, pass:cycle+1};
}
function ecStored(entry){
  // an answer already written keeps its own chapter and question, whatever the date now says
  if(!entry || !(entry.ec||"").trim() || !entry.ecCh) return null;
  var ch = Number(entry.ecCh), qi = Number(entry.ecQ)||0, bank = ecBank(ch);
  return {ch:ch, qi:qi, q:bank[qi] || "", ref:"1 Timothy "+ch, cycle:null, pass:null};
}
function ecDays(){
  // calendar days in the run so far: EC_START through today (capped at Christmas Eve)
  var today = keyOf(), last = today < EC_END ? today : EC_END;
  if(last < EC_START) return 0;
  return ecOffset(last) + 1;
}
function ecMap(){
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];

/* ---------- dates ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseKey(k){ var p=k.split("-").map(Number); return {y:p[0],m:p[1],d:p[2]}; }
function asDate(k){ var p=parseKey(k); return new Date(p.y,p.m-1,p.d); }
function prettyDate(k){ return asDate(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }
function shortDate(k){ return asDate(k).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function monthShort(y,m){ return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short",year:"numeric"}); }
function goalIndex(k, n){
  // one goal per calendar date, seeded from the date so both devices agree all day;
  // never the same goal two days running
  if(n <= 0) return -1;
  var h = function(str){ var x = 5381; for(var i=0;i<str.length;i++){ x = ((x<<5)+x+str.charCodeAt(i))>>>0; } return x; };
  var i = h(k) % n;
  var d = asDate(k); d.setDate(d.getDate()-1);
  if(n > 1 && i === h(keyOf(d)) % n) i = (i+1) % n;
  return i;
}

function nextUnloggedDay(){

  for(var d=1; d<=PLAN.length; d++){
    if(answered(state.entries[d]) === 0) return d;
  }
  return PLAN.length;
}
function currentDay(){
  // today's working day: the first day that is unwritten OR was written today.
  // Writing ahead (posts for later days) never moves this until the calendar rolls over.
  var today = keyOf();
  for(var d=1; d<=PLAN.length; d++){
    var e = state.entries[d];
    if(!e || answered(e) === 0 || e.date === today) return d;
  }
  return PLAN.length;
}

/* ---------- scoring (by calendar date) ---------- */
function dateMap(){
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date) return;
    var cur = m[e.date];
    if(!cur || answered(e) > answered(cur)) m[e.date] = e;
  });
  return m;
}
function planDayMap(){
  // calendar date -> plan day number of the entry shown on that date (mirrors dateMap)
  var best = {}, out = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || staleEntry(e)) return;
    var cur = best[e.date];
    if(!cur || answered(e) > answered(cur)){ best[e.date] = e; out[e.date] = Number(k); }
  });
  return out;
}
function firstDate(){
  var ds = Object.keys(dateMap()).sort();
  return ds.length ? ds[0] : null;
}
function monthStats(y,m){
  var start = firstDate(); if(!start) return null;
  var dm = dateMap(), s = parseKey(start), now = parseKey(keyOf());
  var first = (y===s.y && m===s.m) ? s.d : 1;
  var last  = (y===now.y && m===now.m) ? now.d : daysInMonth(y,m);
  var elapsed = last-first+1, complete=0, partial=0, marks={};
  for(var d=first; d<=last; d++){
    var e = dm[y+"-"+pad(m)+"-"+pad(d)];
    if(isComplete(e)){ complete++; marks[d]="complete"; }
    else if(e && answered(e)>0){ partial++; marks[d]="partial"; }
    else marks[d]="missed";
  }
  return {y:y,m:m,first:first,last:last,elapsed:elapsed,complete:complete,partial:partial,
          marks:marks, pct: elapsed>0 ? (complete/elapsed)*100 : 0};
}
function allMonths(){
  var start = firstDate(); if(!start) return [];
  var s = parseKey(start), now = parseKey(keyOf()), out=[], y=s.y, m=s.m;
  while(y<now.y || (y===now.y && m<=now.m)){ out.push(monthStats(y,m)); m++; if(m>12){m=1;y++;} }
  return out.reverse();
}
function weekStats(){
  var start = firstDate(); if(!start) return null;
  var dm = dateMap(), sd = asDate(start), now = parseKey(keyOf()), days=[];
  for(var i=6;i>=0;i--){
    var d = new Date(now.y, now.m-1, now.d-i);
    if(d < sd) continue;
    var k = keyOf(d), e = dm[k];
    days.push({k:k, state: isComplete(e) ? "complete" : (e && answered(e)>0 ? "partial" : "missed")});
  }
  var complete = days.filter(function(x){return x.state==="complete";}).length;
  return {days:days, complete:complete, elapsed:days.length,
          pct: days.length ? (complete/days.length)*100 : 0};
}

/* ---------- tracker scoring (by the day the answer describes) ---------- */
function yKey(){ var d = new Date(); d.setDate(d.getDate()-1); return keyOf(d); }
function pmMap(f){
  // calendar day -> true (good) / false (slipped) / null (didn't happen, e.g. no meeting),
  // keyed to the day the answer describes:
  // P/M describe the day BEFORE the entry's date, J describes the entry's own day
  var t = trackerBy(f), m = {};
  var score = function(x){ return x === "off" ? null : x === t.good; };
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || !hasVal(f, e[f])) return;
    var d = asDate(e.date); d.setDate(d.getDate()+t.shift);
    var key = keyOf(d), cur = m[key];
    if(!cur || (e.savedAt||"") > (cur.savedAt||"")) m[key] = {v:score(e[f]), savedAt:e.savedAt};
  });
  // marks filled in from the calendar are already keyed to the day they describe
  Object.keys(state.marks||{}).forEach(function(dk){
    var r = state.marks[dk], at = r[f+"At"]||"", cur = m[dk];
    if(!hasVal(f, r[f])) return;
    if(!cur || at > (cur.savedAt||"")) m[dk] = {v:score(r[f]), savedAt:at};
  });
  var out = {};
  Object.keys(m).forEach(function(k){ out[k] = m[k].v; });
  return out;
}
function tNow(f){ return trackerBy(f).shift < 0 ? yKey() : keyOf(); }

/* ---------- calendar backfill: tracker marks for days with no entry ---------- */
// state.marks[day] = {p:"yes"|"no"|"", pAt:iso, ...}, keyed to the day the answer DESCRIBES.
// A cleared mark keeps its time so the clear syncs too.
function shiftKey(k, n){ var d = asDate(k); d.setDate(d.getDate()+n); return keyOf(d); }
// "st" (steps, a number) rides the same store as the yes/no trackers
var NUMFIELDS = {st:-1, kg:0};   // numeric marks and the day they describe (steps: yesterday, sessions: that day)
function hasVal(f, x){ return NUMFIELDS[f] !== undefined ? (typeof x === "number" && isFinite(x)) : (x === "yes" || x === "no" || x === "off"); }
function markVal(f, dk){
  var r = (state.marks||{})[dk], v = r && r[f];
  return hasVal(f, v) ? v : undefined;
}
function putMark(f, dk, v){
  if(!state.marks) state.marks = {};
  var r = state.marks[dk] || (state.marks[dk] = {});
  r[f] = (v === "" || v == null) ? "" : v; r[f+"At"] = new Date().toISOString();
}
function mergeMarks(src){
  // per day and tracker, the most recent edit wins
  var changed = false;
  if(!state.marks) state.marks = {};
  Object.keys(src||{}).forEach(function(dk){
    var theirs = src[dk] || {}, mine = state.marks[dk] || {};
    TRACKERS.map(function(t){ return t.id; }).concat(Object.keys(NUMFIELDS)).forEach(function(f){
      var at = f+"At";
      if(theirs[at] && theirs[at] > (mine[at]||"")){ mine[f] = theirs[f] != null ? theirs[f] : ""; mine[at] = theirs[at]; changed = true; }
    });
    if(Object.keys(mine).length) state.marks[dk] = mine;
  });
  return changed;
}
function setMark(f, dk, v){
  // Set (v = "yes"/"no") or clear (v = "") tracker f for day dk from the calendar.
  // If a written entry already holds this answer, or is the entry whose Today card asks it,
  // edit that entry so the Today card and the calendar never disagree; otherwise store a mark.
  var shift = NUMFIELDS[f] !== undefined ? NUMFIELDS[f] : trackerBy(f).shift, sd = shiftKey(dk, -shift), today = keyOf(), cur = currentDay();
  var holder = null, host = null;
  loggedDays().forEach(function(n){
    var e = state.entries[n];
    if(e.date !== sd || staleEntry(e)) return;
    if(hasVal(f, e[f]) && (!holder || (e.savedAt||"") > (holder.savedAt||""))) holder = e;
    if(!host && (sd < today || n === cur)) host = e;
  });
  var e = holder || host;
  if(e){
    if(v !== "" && v != null) e[f] = v; else delete e[f];
    e.savedAt = new Date().toISOString();
    if(markVal(f, dk) !== undefined) putMark(f, dk, "");
  } else {
    putMark(f, dk, v);
  }
  save();
}

/* ---------- steps: walking goal through Valentine's Day ---------- */
// The count on the Today card describes YESTERDAY, like P/M: entry.st, or state.marks[day].st
// when filled in from the calendar. Main goal first; once it is reached the stretch goal
// takes over everywhere (daily need, projections, the 7-day grade).
var STEP_START = "2026-09-13";
var STEP_END   = "2027-02-14";
var STEP_GOAL = 1000000, STEP_STRETCH = 2000000;
// below 100% of what was needed; 100%+ is an A, and A+ when every day beat the need
var STEP_GRADES = [[95,"B+"],[90,"B"],[85,"B−"],[80,"C+"],[75,"C"],[70,"C−"],[65,"D+"],[60,"D"],[55,"D−"]];
var stepRange = "W", stepResize = null;

function fmtN(n){ return Math.round(n).toLocaleString("en-US"); }
function compactN(n){
  if(n >= 999500) return (Math.round(n/1e5)/10)+"M";
  return n >= 1000 ? Math.round(n/1000)+"K" : String(Math.round(n));
}
function parseSteps(s){ var d = String(s||"").replace(/[^\d]/g, ""); return d ? Math.min(Number(d), 250000) : null; }
function stepGrade(p){ for(var i=0;i<STEP_GRADES.length;i++){ if(p>=STEP_GRADES[i][0]) return STEP_GRADES[i][1]; } return "F"; }
function stepTarget(total){ return total >= STEP_GOAL ? STEP_STRETCH : STEP_GOAL; }
function stepMap(){
  // day walked -> steps; the most recent edit wins, same as the trackers
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || !hasVal("st", e.st)) return;
    var dk = shiftKey(e.date, -1), cur = m[dk];
    if(!cur || (e.savedAt||"") > cur.at) m[dk] = {v:e.st, at:e.savedAt||""};
  });
  Object.keys(state.marks||{}).forEach(function(dk){
    var r = state.marks[dk], at = r.stAt||"", cur = m[dk];
    if(hasVal("st", r.st) && (!cur || at > cur.at)) m[dk] = {v:r.st, at:at};
  });
  var out = {};
  Object.keys(m).forEach(function(k){ out[k] = m[k].v; });
  return out;
}
function stepStats(){
  var map = stepMap(), today = keyOf(), yk = yKey();
  var last = yk < STEP_END ? yk : STEP_END;              // latest day that can have a count
  var span = countDays(STEP_START, STEP_END), pace = STEP_GOAL / span;
  var days = [], total = 0, logged = 0, best = 0, bestK = null, overPace = 0;
  for(var d = asDate(STEP_START); keyOf(d) <= last; d.setDate(d.getDate()+1)){
    var k = keyOf(d), v = map[k];
    days.push({k:k, v:v});
    if(v != null){ total += v; logged++; if(v > best){ best = v; bestK = k; } if(v >= pace) overPace++; }
  }
  // yesterday with no count yet is still open, not a zero
  var closed = days.length && days[days.length-1].v == null && days[days.length-1].k === yk ? days.slice(0, -1) : days;
  var streak = 0;
  for(var i = closed.length-1; i >= 0 && closed[i].v != null && closed[i].v >= pace; i--) streak++;
  var from = (map[yk] != null || yk < STEP_START) ? today : yk;
  if(from < STEP_START) from = STEP_START;
  var daysLeft = from <= STEP_END ? countDays(from, STEP_END) : 0;
  var target = stepTarget(total), remain = Math.max(0, target - total);
  var need = daysLeft ? Math.ceil(remain / daysLeft) : 0;
  var avg = logged ? total / logged : 0;
  var hitDate = (remain > 0 && avg > 0) ? shiftKey(from, Math.ceil(remain / avg) - 1) : null;
  // trailing 7 days, graded against what the goal needed per day when that stretch began
  var w = closed.slice(-7), before = 0, taken = 0, allOver = w.length > 0;
  closed.slice(0, closed.length - w.length).forEach(function(x){ before += x.v || 0; });
  var wNeed = w.length ? Math.max(0, stepTarget(before) - before) / countDays(w[0].k, STEP_END) : 0;
  w.forEach(function(x){ taken += x.v || 0; if(!(x.v > wNeed)) allOver = false; });
  var required = Math.ceil(wNeed * w.length);
  var pct = required > 0 ? taken / required * 100 : 100;
  return {map:map, days:days, total:total, logged:logged, best:best, bestK:bestK, pace:pace, overPace:overPace,
          streak:streak, counted:closed.length, from:from, daysLeft:daysLeft, target:target, need:need, avg:avg,
          projected: total + avg * daysLeft, hitDate:hitDate, span:span, last:last,
          w:w, required:required, taken:taken, pct:pct, pass: w.length > 0 && pct >= 100,
          grade: !w.length ? null : (pct >= 100 ? (allOver ? "A+" : "A") : stepGrade(pct))};
}
function stepNeedText(){
  var s = stepStats();
  if(s.total >= STEP_STRETCH) return "Stretch goal done — "+fmtN(s.total)+" steps";
  if(!s.daysLeft) return fmtN(s.total)+" steps — the goal window has closed";
  return fmtN(s.need)+"/day to reach "+fmtN(s.target)+" by Feb 14"+(s.total >= STEP_GOAL ? " · goal done, now the stretch" : "");
}
function stepsRow(entry, stale, effDate){
  // Today card, under P/M: yesterday's steps, then what each day needs from here
  if(!effDate) return "";
  var dk = shiftKey(effDate, -1);
  if(dk < STEP_START || dk > STEP_END) return "";
  var v = stale ? undefined : entry.st;
  if(!hasVal("st", v)) v = markVal("st", dk);
  return '<div class="stepline"><label class="pmlab" for="steps">Steps</label>'+
         '<input id="steps" class="stepin" data-s="1" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="'+
         (hasVal("st", v) ? fmtN(v) : "")+'">'+
         '<span class="stepneed" id="stepNeed">'+esc(stepNeedText())+'</span></div>';
}
function stepsCard(){
  if(keyOf() <= STEP_START) return "";
  var s = stepStats(), stretch = s.total >= STEP_GOAL;
  var expPct = Math.min(100, s.days.length / s.span * 100);
  var meter = function(lab, goal){
    var pct = Math.min(100, s.total / goal * 100);
    return '<div class="trow"><span class="tlab">'+lab+'</span>'+
           '<div class="bar sm"><i style="width:'+pct+'%"></i><u style="left:'+expPct+'%" title="Where pace puts you today"></u></div>'+
           '<span class="tpct">'+pct.toFixed(pct < 10 ? 1 : 0)+'%</span><span class="tgoal">'+compactN(goal)+'</span></div>';
  };
  var tile = function(lab, val, sub){
    return '<div class="stile"><span>'+esc(lab)+'</span><b>'+esc(val)+'</b>'+(sub ? '<small>'+esc(sub)+'</small>' : '')+'</div>';
  };
  var plural = function(n, w){ return n+" "+w+(n === 1 ? "" : "s"); };
  var h = '<section class="card" style="margin-top:20px" id="stepsCard">'+
    '<div class="sechead"><span>Steps · Valentine’s Day</span><span>'+
    (s.daysLeft ? plural(s.daysLeft, "day")+' left' : 'Window closed')+'</span></div>'+
    '<div class="shero"><b>'+fmtN(s.total)+'</b><span>steps since '+esc(shortDate(STEP_START))+'</span></div>'+
    '<div class="trows">'+meter("Goal", STEP_GOAL)+meter("Stretch", STEP_STRETCH)+'</div>'+
    '<div class="skeys"><span><i></i>Taken</span><span><i class="g"></i>Goal pace</span><span><i class="s"></i>Stretch pace</span></div>'+
    '<div class="schart" id="stepCum" role="img" aria-label="Running total of steps against goal pace and stretch pace"></div>';

  h += '<div class="savg"><div><div class="eyebrow">Daily average</div>'+
       '<div class="savgn"><b id="stepAvg">—</b>steps</div><div class="sub" id="stepAvgRange"></div></div>'+
       '<div class="seg" id="stepRange">'+
       [["W","Week"],["M","Month"],["All","All"]].map(function(r){
         return '<button data-r="'+r[0]+'"'+(stepRange === r[0] ? ' class="sel"' : '')+'>'+r[1]+'</button>';
       }).join("")+'</div></div>'+
       '<div class="schart" id="stepBars" role="img" aria-label="Steps per day"></div>';

  h += '<div class="savg" style="margin-top:20px"><div><div class="eyebrow">Needed per day</div>'+
       '<div class="sub">recalculated after every day’s count, for the days still left</div></div></div>'+
       '<div class="schart" id="stepNeed" role="img" aria-label="Steps needed per day for the rest of the goal, over time"></div>'+
       '<div class="skeys"><span><i></i>For 1M</span><span><i class="s"></i>For 2M</span></div>';

  var reach = s.total >= STEP_STRETCH ? "Done" : (s.hitDate ? (s.hitDate <= STEP_END ? shortDate(s.hitDate) : "After Feb 14") : "—");
  h += '<div class="stiles">'+
    tile("Needed per day", s.daysLeft && s.total < STEP_STRETCH ? fmtN(s.need) : "—", stretch ? "for the stretch goal" : "for the goal")+
    tile("Daily average", s.logged ? fmtN(s.avg) : "—", plural(s.logged, "day")+" logged")+
    tile("Best day", s.best ? fmtN(s.best) : "—", s.bestK ? shortDate(s.bestK) : "")+
    tile("Streak", plural(s.streak, "day"), s.overPace+" of "+s.counted+" at "+fmtN(s.pace)+"+")+
    tile("By Feb 14", s.logged ? compactN(s.projected) : "—", "at your daily average")+
    tile("Reach "+compactN(s.target), reach, s.total >= STEP_STRETCH ? "stretch goal done" : "at your daily average")+
    '</div>';

  if(s.w.length){
    h += '<div class="arow" style="margin-top:14px"><span class="tlab">Last 7</span>'+
         '<span class="det">'+fmtN(s.taken)+' of '+fmtN(s.required)+' needed'+
         (s.pass ? '<b class="spass on">Pass</b>' : '<b class="spass">Short '+fmtN(s.required - s.taken)+'</b>')+'</span>'+
         '<span class="apct'+(s.pass ? " on" : "")+'">'+Math.min(999, s.pct).toFixed(0)+'%<b>'+s.grade+'</b></span></div>';
  }
  h += '<div class="note">Last 7 is graded on what the goal needed each day when that week began: 100% is an A, '+
       'and A+ means every day beat it. Days with no count are zeros — tap the day on the calendar to fill one in.</div>';

  var rows = s.days.filter(function(x){ return x.v != null; }).reverse();
  if(rows.length){
    h += '<details class="slog"><summary>Daily log</summary><table>';
    rows.forEach(function(x){ h += '<tr><td>'+esc(shortDate(x.k))+'</td><td>'+fmtN(x.v)+'</td></tr>'; });
    h += '</table></details>';
  }
  return h + '</section>';
}
function stepTip(date, rows){
  // values lead, labels follow; each row keyed by a short line in its series style
  return '<div class="stipd">'+esc(date)+'</div>'+rows.map(function(r){
    return '<div class="stipr"><i class="'+(r[2]||"")+'"></i><b>'+r[1]+'</b>'+esc(r[0])+'</div>';
  }).join("");
}
function hoverLayer(box, n, idxAt, paint, startIdx){
  // one tooltip per chart: the pointer snaps to the nearest day, arrow keys step through
  var tip = document.createElement("div"), cur = -1;
  tip.className = "stip"; tip.hidden = true; box.appendChild(tip);
  var show = function(i){
    cur = Math.max(0, Math.min(n-1, i));
    var r = paint(cur);
    tip.innerHTML = r.html; tip.hidden = false;
    var left = r.x + 12, tw = tip.offsetWidth;
    if(left + tw > box.clientWidth) left = r.x - tw - 12;
    tip.style.left = Math.max(0, left)+"px";
  };
  var hide = function(){ cur = -1; tip.hidden = true; paint(-1); };
  box.tabIndex = 0;
  box.onpointermove = box.onpointerdown = function(ev){ show(idxAt(ev.clientX - box.getBoundingClientRect().left)); };
  box.onpointerleave = function(ev){ if(ev.pointerType === "mouse") hide(); };
  box.onblur = hide;
  box.onkeydown = function(ev){
    if(ev.key === "ArrowLeft" || ev.key === "ArrowRight"){
      ev.preventDefault(); show(cur < 0 ? startIdx : cur + (ev.key === "ArrowRight" ? 1 : -1));
    } else if(ev.key === "Escape") hide();
  };
}
function drawCum(box, s){

  var X = function(i){ return L + (n > 1 ? i/(n-1) : 0) * pw; };
  var Y = function(v){ return T + ph - v/ymax*ph; };

    o += '<line class="grid" x1="'+L+'" x2="'+(L+pw)+'" y1="'+gy+'" y2="'+gy+'"/>'+
         '<text class="axis" x="'+(L-6)+'" y="'+(gy+3)+'" text-anchor="end">'+(gv ? compactN(gv) : "0")+'</text>';
  }

    var mk = shiftKey(STEP_START, i);
    if(mk.slice(8) === "01") o += '<text class="axis" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+
      esc(asDate(mk).toLocaleDateString(undefined, {month:"short"}))+'</text>';
  }
  o += '<line class="pace2" x1="'+X(0)+'" y1="'+Y(paceAt(STEP_STRETCH,0))+'" x2="'+X(n-1)+'" y2="'+Y(STEP_STRETCH)+'"/>'+
       '<line class="pace" x1="'+X(0)+'" y1="'+Y(paceAt(STEP_GOAL,0))+'" x2="'+X(n-1)+'" y2="'+Y(STEP_GOAL)+'"/>'+
       '<text class="lbl" x="'+(L+pw+6)+'" y="'+(Y(STEP_GOAL)+3)+'">Goal</text>'+
       '<text class="lbl" x="'+(L+pw+6)+'" y="'+(Y(STEP_STRETCH)+3)+'">Stretch</text>';
  if(cum.length){
    var pts = cum.map(function(v, j){ return X(j).toFixed(1)+","+Y(v).toFixed(1); });
    var li = cum.length-1;
    o += '<path class="actarea" d="M'+X(0).toFixed(1)+','+Y(0)+' L'+pts.join(" L")+' L'+X(li).toFixed(1)+','+Y(0)+' Z"/>'+
         '<path class="act" d="M'+pts.join(" L")+'"/>'+
         '<circle class="dot" cx="'+X(li)+'" cy="'+Y(cum[li])+'" r="4"/>'+
         '<text class="lbl strong" x="'+X(li)+'" y="'+(Y(cum[li])-10)+'" text-anchor="'+
         (li < n*0.08 ? "start" : (li > n*0.85 ? "end" : "middle"))+'">'+compactN(cum[li])+'</text>';
  }

}
function drawBars(box, s){
  var endK = s.last, startK, n;
  if(stepRange === "All"){ startK = STEP_START; n = Math.max(1, countDays(STEP_START, endK)); }
  else { n = stepRange === "M" ? 30 : 7; startK = shiftKey(endK, -(n-1)); }
  var list = [], sum = 0, cnt = 0, top = 0, inGoal = 0;
  for(var i = 0; i < n; i++){
    var k = shiftKey(startK, i), v = k >= STEP_START ? s.map[k] : undefined;
    list.push({k:k, v:v});
    if(k >= STEP_START) inGoal++;
    if(v != null){ sum += v; cnt++; if(v > top) top = v; }
  }
  var avgEl = document.getElementById("stepAvg"), rngEl = document.getElementById("stepAvgRange");
  if(avgEl) avgEl.textContent = cnt ? fmtN(sum/cnt) : "—";
  if(rngEl) rngEl.textContent = shortDate(startK)+" – "+shortDate(endK)+(cnt < inGoal ? " · "+cnt+" of "+inGoal+" days logged" : "");
  var need = s.daysLeft && s.total < STEP_STRETCH ? s.need : 0;
  var W = Math.max(260, box.clientWidth), H = 160, L = 34, R = 6, T = 14, B = 22;
  var pw = W-L-R, ph = H-T-B;
  var hi = Math.max(top, need, 1000);
  var step = hi <= 8000 ? 2000 : (hi <= 16000 ? 4000 : (hi <= 30000 ? 10000 : 20000));
  var ymax = Math.ceil(hi * 1.12 / step) * step;
  var Y = function(v){ return T + ph - v/ymax*ph; };
  var slot = pw / n, bw = Math.min(24, Math.max(1, slot - 2)), y0 = T + ph;
  var o = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  for(var g = 0; g <= ymax; g += step){
    o += '<line class="grid" x1="'+L+'" x2="'+(L+pw)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/>'+
         '<text class="axis" x="'+(L-6)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+(g ? compactN(g) : "0")+'</text>';
  }
  list.forEach(function(d, j){
    if(!(d.v > 0)) return;
    var x = L + j*slot + (slot-bw)/2, y = Y(d.v), r = Math.min(4, bw/2, y0-y);
    o += '<path class="sb" data-i="'+j+'" d="M'+x+','+y0+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+
         ' H'+(x+bw-r)+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+' V'+y0+' Z"/>';
  });
  if(need > 0){
    var ny = Y(need);
    o += '<line class="need" x1="'+L+'" x2="'+(L+pw)+'" y1="'+ny+'" y2="'+ny+'"/>'+
         '<text class="lbl" x="'+(L+pw)+'" y="'+(ny-5)+'" text-anchor="end">'+fmtN(need)+' needed</text>';
  }
  list.forEach(function(d, j){
    var lab = "";
    if(stepRange === "W") lab = asDate(d.k).toLocaleDateString(undefined, {weekday:"narrow"});
    else if(stepRange === "M" || n <= 31){ if((n-1-j) % 7 === 0) lab = shortDate(d.k); }
    else if(d.k.slice(8) === "01") lab = asDate(d.k).toLocaleDateString(undefined, {month:"short"});
    if(lab) o += '<text class="axis" x="'+(L + j*slot + slot/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(lab)+'</text>';
  });
  box.innerHTML = o + '</svg>';
  var marks = box.querySelectorAll(".sb");
  hoverLayer(box, n, function(x){ return Math.floor((x-L)/slot); }, function(j){
    marks.forEach(function(m){ m.classList.toggle("hot", Number(m.dataset.i) === j); });
    if(j < 0) return null;
    var d = list[j];
    return {x: L + j*slot + slot/2, html: stepTip(asDate(d.k).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}),
      d.v != null ? [["steps", fmtN(d.v), ""]] : [["no count", "—", "n"]])};
  }, n-1);
}
function needSeries(s){
  // What every remaining day needs, recomputed after each day's count lands: a day above the
  // line pulls the rest of the run down, a blank day pushes it up.
  var out = [], run = 0, span0 = countDays(STEP_START, STEP_END);
  out.push({k:STEP_START, start:true, left:span0, v:null,
            g: STEP_GOAL/span0, s: STEP_STRETCH/span0});
  s.days.forEach(function(d){
    run += d.v || 0;
    var after = shiftKey(d.k, 1), left = after <= STEP_END ? countDays(after, STEP_END) : 0;
    out.push({k:d.k, left:left, v:d.v, cum:run,
              g: left ? Math.max(0, (STEP_GOAL - run)/left) : 0,
              s: left ? Math.max(0, (STEP_STRETCH - run)/left) : 0});
  });
  return out;
}
function drawNeed(box, s){
  var pts = needSeries(s), n = pts.length;
  var W = Math.max(260, box.clientWidth), H = 170, L = 40, R = 40, T = 14, B = 22;
  var pw = W-L-R, ph = H-T-B;
  var vals = [];
  pts.forEach(function(p){ vals.push(p.g, p.s); });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(hi - lo < hi * 0.08){ lo = hi * 0.9; }            // an almost flat run still needs room to read
  var ymin = Math.max(0, lo * 0.92), ymax = hi * 1.06 || 1;
  var X = function(i){ return L + (n > 1 ? i/(n-1) : 0) * pw; };
  var Y = function(v){ return T + ph - (v - ymin)/(ymax - ymin) * ph; };
  var o = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  for(var q = 0; q <= 4; q++){
    var gv = ymin + (ymax-ymin)*q/4, gy = Y(gv);
    o += '<line class="grid" x1="'+L+'" x2="'+(L+pw)+'" y1="'+gy+'" y2="'+gy+'"/>'+
         '<text class="axis" x="'+(L-6)+'" y="'+(gy+3)+'" text-anchor="end">'+compactN(gv)+'</text>';
  }
  for(var i = 1; i < n; i++){
    if(pts[i].k.slice(8) === "01") o += '<text class="axis" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+
      esc(asDate(pts[i].k).toLocaleDateString(undefined, {month:"short"}))+'</text>';
  }
  var path = function(key, cls){
    var d = pts.map(function(p, j){ return X(j).toFixed(1)+","+Y(p[key]).toFixed(1); });
    return '<path class="'+cls+'" fill="none" d="M'+d.join(" L")+'"/>';
  };
  o += path("s", "pace2") + path("g", "act");
  var li = n-1, last = pts[li];
  o += '<text class="lbl" x="'+(L+pw+6)+'" y="'+(Y(last.s)+3)+'">2M</text>'+
       '<text class="lbl" x="'+(L+pw+6)+'" y="'+(Y(last.g)+3)+'">1M</text>'+
       '<circle class="dot" cx="'+X(li)+'" cy="'+Y(last.g)+'" r="4"/>'+
       '<text class="lbl strong" x="'+X(li)+'" y="'+(Y(last.g)-10)+'" text-anchor="end">'+fmtN(last.g)+'</text>'+
       '<line class="xh" y1="'+T+'" y2="'+(T+ph)+'" x1="0" x2="0" visibility="hidden"/></svg>';
  box.innerHTML = o;
  var xh = box.querySelector(".xh");
  hoverLayer(box, n, function(x){ return Math.round((x-L)/pw*(n-1)); }, function(j){
    if(j < 0){ xh.setAttribute("visibility", "hidden"); return null; }
    var p = pts[j], x = X(j);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    var rows = [];
    if(!p.start) rows.push(["steps that day", p.v != null ? fmtN(p.v) : "—", p.v != null ? "" : "n"]);
    rows.push(["then needed for 1M", fmtN(p.g), ""], ["for 2M", fmtN(p.s), "s"]);
    return {x:x, html: stepTip(p.start ? "Before the first day" : shortDate(p.k), rows)};
  }, n-1);
}
function drawSteps(){
  var cum = document.getElementById("stepCum"), bars = document.getElementById("stepBars");
  if(!cum || !bars) return;
  var s = stepStats();
  drawCum(cum, s); drawBars(bars, s);
  var need = document.getElementById("stepNeed");
  if(need) drawNeed(need, s);
}
function pmFirst(map){
  var ds = Object.keys(map).sort();
  return ds.length ? ds[0] : null;
}
function countDays(fromKey, toKey, wd){
  // calendar days from..to inclusive, optionally only one weekday (0 = Sunday)
  var a = asDate(fromKey), b = asDate(toKey), c = 0;
  for(var d = new Date(a); d <= b; d.setDate(d.getDate()+1)){ if(wd == null || d.getDay() === wd) c++; }
  return c;
}
function pmMonthStats(map, first, y, m, nowKey, wd){
  var s = parseKey(first), now = parseKey(nowKey || yKey());
  if(y>now.y || (y===now.y && m>now.m)) return null;
  if(y<s.y || (y===s.y && m<s.m)) return null;
  var a = (y===s.y && m===s.m) ? s.d : 1;
  var b = (y===now.y && m===now.m) ? now.d : daysInMonth(y,m);
  if(b < a) return null;
  var clean = 0, el = 0;
  for(var d=a; d<=b; d++){
    if(wd != null && new Date(y,m-1,d).getDay() !== wd) continue;
    if(map[y+"-"+pad(m)+"-"+pad(d)]===null) continue;   // didn't happen: counts neither way
    el++;
    if(map[y+"-"+pad(m)+"-"+pad(d)]===true) clean++;
  }
  if(el === 0) return null;
  return {clean:clean, elapsed:el, pct: el>0 ? (clean/el)*100 : 0};
}
function tWeek(map, first, nowKey, wd){
  var sd = asDate(first), now = parseKey(nowKey || yKey()), out=[], n=0;
  for(var i=6;i>=0;i--){
    var d = new Date(now.y, now.m-1, now.d-i);
    if(d < sd) continue;
    if(wd != null && d.getDay() !== wd) continue;
    var k = keyOf(d), v = map[k];
    if(v === null) continue;   // didn't happen: left out of the week
    out.push({k:k, state: v===true ? "complete" : (v===false ? "fail" : "missed")});
    if(v===true) n++;
  }
  return {days:out, n:n, elapsed:out.length, pct: out.length ? (n/out.length)*100 : 0};
}

/* ---------- pelvic floor: a guided session, three a day ---------- */
// Routine follows Cleveland Clinic / MSKCC guidance for men: 10 endurance holds (squeeze and
// relax for the same count, starting at 5 seconds and building toward 10 over weeks), then 10
// quick flicks of about a second, at least 3 sessions a day. The guidance allows lying, sitting
// or standing; he does all of his sitting, because that is when he actually does them.
var KEG_START = "2026-09-16";
var KEG_BREAK = 10, KEG_FLICK_HOLD = 1, KEG_FLICK_REST = 2;
var KEG_WHERE = "sitting";
var kegRun = null, kegTimer = null, kegLock = null;

// Progressive overload with a deload every fourth week: three weeks of building, then a lighter
// week, and the block after starts above where the last one did. You only move up a level by
// doing the work — see kegProgram() — so a missed week never jumps you to 9-second holds.
var KEG_LEVELS = [
  null,
  {hold:5,  reps:10, flicks:10, sets:3, name:"Build"},
  {hold:6,  reps:10, flicks:10, sets:3, name:"Build"},
  {hold:7,  reps:10, flicks:10, sets:3, name:"Build"},
  {hold:5,  reps:8,  flicks:8,  sets:2, name:"Deload"},
  {hold:7,  reps:10, flicks:12, sets:3, name:"Build"},
  {hold:8,  reps:10, flicks:12, sets:3, name:"Build"},
  {hold:9,  reps:10, flicks:12, sets:3, name:"Build"},
  {hold:6,  reps:8,  flicks:8,  sets:2, name:"Deload"},
  {hold:9,  reps:12, flicks:15, sets:3, name:"Build"},
  {hold:10, reps:12, flicks:15, sets:3, name:"Build"},
  {hold:10, reps:12, flicks:15, sets:3, name:"Peak"},
  {hold:7,  reps:8,  flicks:10, sets:2, name:"Deload"}
];
function kegLevelPlan(l){
  if(l < 1) l = 1;
  if(l < KEG_LEVELS.length) return KEG_LEVELS[l];
  // past the twelfth week it holds at the top, still deloading every fourth week
  return ((l - KEG_LEVELS.length) % 4) === 3 ?
    {hold:7, reps:8, flicks:10, sets:2, name:"Deload"} :
    {hold:10, reps:12, flicks:15, sets:3, name:"Maintain"};
}
function kegProgram(){
  // one level per week since the start, but a week only counts if at least half its sessions
  // were done — so the routine advances at the pace you actually keep
  var m = kegMap(), today = keyOf(), lvl = 1, weeks = [], d = asDate(KEG_START), end = asDate(today);
  while(d <= end){
    var sets = kegLevelPlan(lvl).sets, done = 0, target = 0, closed = true, dd = new Date(d);
    for(var i=0; i<7; i++){
      var k = keyOf(dd);
      if(k > today) closed = false;
      else { done += m[k] || 0; target += sets; }
      dd.setDate(dd.getDate()+1);
    }
    weeks.push({start:keyOf(d), lvl:lvl, done:done, target:target, closed:closed});
    if(closed && target && done >= target/2) lvl++;
    d.setDate(d.getDate()+7);
  }
  return {level:lvl, weeks:weeks, plan:kegLevelPlan(lvl), week:weeks[weeks.length-1], next:kegLevelPlan(lvl+1)};
}
function kegGoalOn(prog, k){
  // the daily session goal for the week that day fell in
  var ws = prog.weeks;
  for(var i=ws.length-1; i>=0; i--){ if(k >= ws[i].start) return kegLevelPlan(ws[i].lvl).sets; }
  return prog.plan.sets;
}
function kegDayPct(n, g){
  // all of that day's sessions is full marks; one short of it is a pass, not a miss
  if(g <= 0) return 100;
  if(n >= g) return 100;
  if(g > 1 && n >= g - 1) return 80;
  return (n / g) * 100;
}
function kegGrade(days){
  // A+ is reserved for every day at the full count, so one 2-of-3 day caps the week at A
  if(!days.length) return null;
  var sum = 0, full = 0, pass = 0, miss = 0;
  days.forEach(function(d){
    sum += kegDayPct(d.n, d.g);
    if(d.n >= d.g) full++;
    else if(d.g > 1 && d.n >= d.g - 1) pass++;
    else miss++;
  });
  var pct = sum / days.length, allFull = full === days.length, g = allFull ? "A+" : gradeFor(pct);
  if(!allFull && g === "A+") g = "A";
  return {pct:pct, grade:g, full:full, pass:pass, miss:miss, n:days.length};
}
function kegPlan(){
  var p = kegProgram().plan;
  var out = [{k:"ready", label:"Get ready", sub:"Breathe normally — don’t clench your stomach, thighs or buttocks", secs:5}];
  for(var i=1; i<=p.reps; i++){
    out.push({k:"hold", label:"Squeeze", sub:"Lift and hold · " + i + " of " + p.reps, secs:p.hold});
    out.push({k:"rest", label:"Relax", sub:"Let go completely · " + i + " of " + p.reps, secs:p.hold});
  }
  out.push({k:"break", label:"Break", sub:"Quick flicks next", secs:KEG_BREAK});
  for(var j=1; j<=p.flicks; j++){
    out.push({k:"flick", label:"Quick squeeze", sub:"Flick " + j + " of " + p.flicks, secs:KEG_FLICK_HOLD});
    out.push({k:"frest", label:"Let go", sub:"Flick " + j + " of " + p.flicks, secs:KEG_FLICK_REST});
  }
  return out;
}
function kegSecs(plan){ var t = 0; plan.forEach(function(x){ t += x.secs; }); return t; }
function kegMap(){
  // day -> sessions done that day; the most recent edit wins, same as steps
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || staleEntry(e) || !hasVal("kg", e.kg)) return;
    var cur = m[e.date];
    if(!cur || (e.savedAt||"") > cur.at) m[e.date] = {v:e.kg, at:e.savedAt||""};
  });
  Object.keys(state.marks||{}).forEach(function(dk){
    var r = state.marks[dk], at = r.kgAt||"", cur = m[dk];
    if(hasVal("kg", r.kg) && (!cur || at > cur.at)) m[dk] = {v:r.kg, at:at};
  });
  var out = {};
  Object.keys(m).forEach(function(k){ out[k] = m[k].v; });
  return out;
}
function parseKeg(s){ var d = String(s||"").replace(/[^\d]/g, ""); return d ? Math.min(Number(d), 20) : null; }
function kegStats(){
  var m = kegMap(), today = keyOf(), end = asDate(today), prog = kegProgram();
  var total = 0, atGoal = 0, anyDay = 0, days = 0, all = [];
  for(var d = asDate(KEG_START); d <= end; d.setDate(d.getDate()+1)){
    var k = keyOf(d), n = m[k] || 0, g0 = kegGoalOn(prog, k);
    days++; total += n;
    all.push({k:k, n:n, g:g0});
    if(n >= g0) atGoal++;
    if(n > 0) anyDay++;
  }
  // today is still open unless it already hit the full count, so it can't drag a grade down
  var closed = all.slice();
  if(closed.length && closed[closed.length-1].k === today && closed[closed.length-1].n < closed[closed.length-1].g) closed.pop();
  var wk7 = closed.slice(-7);
  // a run of days at that day's goal; today only counts once it is there, so a day in progress doesn't break it
  var streak = 0, w = asDate(today);
  if((m[today]||0) < kegGoalOn(prog, today)) w.setDate(w.getDate()-1);
  while(keyOf(w) >= KEG_START && (m[keyOf(w)]||0) >= kegGoalOn(prog, keyOf(w))){ streak++; w.setDate(w.getDate()-1); }
  var last7 = [];
  for(var i=6; i>=0; i--){
    var e2 = asDate(today); e2.setDate(e2.getDate()-i);
    var kk = keyOf(e2);
    if(kk >= KEG_START) last7.push({k:kk, n:m[kk] || 0, g:kegGoalOn(prog, kk)});
  }
  return {prog:prog, plan:prog.plan, goal:prog.plan.sets, today:m[today] || 0, total:total, days:days,
          atGoal:atGoal, anyDay:anyDay, streak:streak, last7:last7, avg: days ? total/days : 0,
          all:all, closed:closed, wk7:wk7, wkGrade:kegGrade(wk7), allGrade:kegGrade(closed)};
}
function kegAdd(n){
  var dk = keyOf();
  setMark("kg", dk, (kegMap()[dk] || 0) + n);
}
function kegBuzz(k){
  try { if(navigator.vibrate) navigator.vibrate(k === "hold" || k === "flick" ? 60 : 25); } catch(e){}
}
function kegWake(on){
  try {
    if(on && navigator.wakeLock && !kegLock){
      navigator.wakeLock.request("screen").then(function(s){ kegLock = s; }, function(){});
    } else if(!on && kegLock){
      if(kegLock.release) kegLock.release(); kegLock = null;
    }
  } catch(e){ kegLock = null; }
}
function kegStart(){
  var plan = kegPlan();
  kegRun = {plan:plan, i:0, left:plan[0].secs, endAt: Date.now() + plan[0].secs*1000, paused:false, done:false};
  if(kegTimer) clearInterval(kegTimer);
  kegTimer = setInterval(kegTick, 100);
  kegWake(true);
  render();
}
function kegTick(){
  if(!kegRun || kegRun.done || kegRun.paused) return;
  var leftMs = kegRun.endAt - Date.now();
  if(leftMs <= 0){
    kegRun.i++;
    if(kegRun.i >= kegRun.plan.length){ kegFinish(); return; }
    kegBuzz(kegRun.plan[kegRun.i].k);
    leftMs = kegRun.plan[kegRun.i].secs * 1000;
    kegRun.endAt = Date.now() + leftMs;
  }
  kegRun.left = Math.max(1, Math.ceil(leftMs/1000));
  kegPaint();
}
function kegPause(){
  if(!kegRun || kegRun.done) return;
  kegRun.paused = !kegRun.paused;
  if(!kegRun.paused) kegRun.endAt = Date.now() + kegRun.left*1000;
  kegWake(!kegRun.paused);
  render();
}
function kegQuit(){
  if(kegTimer){ clearInterval(kegTimer); kegTimer = null; }
  kegWake(false); kegRun = null; render();
}
function kegFinish(){
  if(kegTimer){ clearInterval(kegTimer); kegTimer = null; }
  kegWake(false);
  kegRun = {done:true};
  kegAdd(1);          // save() runs inside setMark
  kegBuzz("hold");
  render();
}
function kegPaint(){
  // updates the running timer in place — render() would steal focus and flicker
  if(!kegRun || kegRun.done) return;
  var st = kegRun.plan[kegRun.i], box = document.getElementById("kegBox");
  if(!st || !box) return;
  box.className = "keg run " + st.k;
  var set = function(id, txt){ var n = document.getElementById(id); if(n) n.textContent = txt; };
  set("kegPhase", st.label);
  set("kegCount", kegRun.paused ? "⏸" : kegRun.left);
  set("kegSub", st.sub);
  set("kegProg", st.k === "flick" || st.k === "frest" ? "Quick flicks" :
                 (st.k === "break" ? "Break" : (st.k === "ready" ? "Getting ready" : "Endurance holds")));
  var done = 0, tot = 0;
  kegRun.plan.forEach(function(x, i){ tot += x.secs; if(i < kegRun.i) done += x.secs; });
  done += st.secs - kegRun.left;
  var bar = document.getElementById("kegBar");
  if(bar) bar.style.width = Math.min(100, (done/tot)*100) + "%";
}
function kegRow(isCurrent){
  // the timer is for right now, so it only shows on the current day; past days fill in from the calendar
  if(!isCurrent || keyOf() < KEG_START) return "";
  var st = kegStats(), p = st.plan, goal = st.goal, n = st.today, wk = st.prog.weeks.length;
  var head = function(right){
    return '<div class="xchead"><span class="goaltag">Pelvic floor</span><span class="xcopt" id="kegProg">' + right + '</span></div>';
  };
  if(kegRun && !kegRun.done){
    var st = kegRun.plan[kegRun.i];
    return '<div class="keg run ' + st.k + '" id="kegBox">' + head("Getting ready") +
           '<div class="kegphase" id="kegPhase">' + esc(st.label) + '</div>' +
           '<div class="kegcount" id="kegCount">' + (kegRun.paused ? "⏸" : kegRun.left) + '</div>' +
           '<div class="kegsub" id="kegSub">' + esc(st.sub) + '</div>' +
           '<div class="bar kegbar"><i id="kegBar" style="width:0%"></i></div>' +
           '<div class="kegrow"><button type="button" class="gbtn" id="kegPause">' + (kegRun.paused ? "Resume" : "Pause") + '</button>' +
           '<button type="button" class="link" id="kegQuit">Stop</button></div></div>';

/* ---------- daily habits: one score across everything being tracked ---------- */
// Every habit carries the same weight. Each is scored across its OWN applicable days — Mondays
// only for G and MG, and never before the day that habit started — and those percentages are
// then averaged flat. Today is left out until it closes, so a day in progress can't drag it down.
function habitDefs(){
  var prog = kegProgram(), dm = dateMap(), sMap = stepMap(), kMap = kegMap(), today = keyOf();
  var pace = STEP_GOAL / countDays(STEP_START, STEP_END);
  var defs = [], rf = firstDate();
  if(rf) defs.push({id:"read", label:"Reading", from:rf,
    score:function(k){ var e = dm[k]; return e ? (answered(e)/3)*100 : 0; }});
  TRACKERS.forEach(function(t){
    var map = pmMap(t.id), from = t.start || pmFirst(map);
    if(!from) return;
    defs.push({id:t.id, label:t.label, from:from, weekday:t.weekday,
      score:function(k){ var v = map[k]; return v === null ? null : (v === true ? 100 : 0); }});
  });
  if(today > STEP_START) defs.push({id:"st", label:"Steps", from:STEP_START, to:STEP_END,
    score:function(k){ var v = sMap[k]; return v == null ? 0 : Math.min(100, v/pace*100); }});
  if(today >= KEG_START) defs.push({id:"kg", label:"Sessions", from:KEG_START,
    score:function(k){ return kegDayPct(kMap[k] || 0, kegGoalOn(prog, k)); }});
  return defs;
}
function habitWindow(defs, fromK, toK){
  var per = [], sum = 0;
  defs.forEach(function(d){
    var startK = fromK > d.from ? fromK : d.from, tot = 0, n = 0;
    if(startK > toK) return;
    for(var dd = asDate(startK); keyOf(dd) <= toK; dd.setDate(dd.getDate()+1)){
      var k = keyOf(dd);
      if(d.to && k > d.to) break;
      if(d.weekday != null && dd.getDay() !== d.weekday) continue;
      var v = d.score(k);
      if(v === null) continue;          // didn't apply (e.g. the group didn't meet)
      tot += v; n++;
    }
    if(n){ var pct = tot/n; per.push({id:d.id, label:d.label, pct:pct, n:n}); sum += pct; }
  });
  return {per:per, pct: per.length ? sum/per.length : 0, n:per.length};
}
function habitsCard(){
  var defs = habitDefs(), today = keyOf(), yest = shiftKey(today, -1);
  if(!defs.length) return "";
  var live = defs.filter(function(d){ return (!d.to || today <= d.to); });
  var wk = habitWindow(defs, shiftKey(yest, -6), yest), all = habitWindow(defs, "1900-01-01", yest);
  var since = defs.map(function(d){ return d.from; }).sort()[0];
  var row = function(x){
    return '<div class="trow"><span class="tlab">'+esc(x.label)+'</span>'+
           '<div class="bar sm"><i style="width:'+Math.min(100, x.pct)+'%"></i>'+
           '<u style="left:'+MONTH_TARGET+'%"></u></div>'+
           '<span class="tpct">'+x.pct.toFixed(0)+'%</span>'+
           '<span class="tgr">'+(x.n < 3 ? "—" : gradeFor(x.pct))+'</span></div>';
  };
  var h = '<section class="card" id="habitsCard"><div class="sechead"><span>Daily habits</span>'+
          '<span>'+live.length+' tracked</span></div>'+
          '<div class="shero"><b>'+(wk.n ? wk.pct.toFixed(0)+'%' : '—')+'</b>'+
          '<span>overall, last 7 days'+(wk.n ? ' · '+gradeFor(wk.pct) : '')+'</span></div>';
  if(wk.n) h += '<div class="trows">'+wk.per.map(row).join("")+'</div>';
  if(all.n) h += '<div class="arow"><span class="tlab">All time</span>'+
                 '<span class="det">'+all.n+' habit'+(all.n === 1 ? '' : 's')+' · since '+esc(shortDate(since))+'</span>'+
                 '<span class="apct'+(all.pct >= MONTH_TARGET ? " on" : "")+'">'+all.pct.toFixed(0)+'%'+
                 '<b>'+gradeFor(all.pct)+'</b></span></div>';
  h += '<div class="note">Every habit counts the same: each is scored over its own days — Mondays only for G and MG, '+
       'steps against the pace the walking goal needs, sessions against that week’s count — and the percentages are averaged. '+
       'Today isn’t counted until it closes, and a habit joins the score the day it starts.</div></section>';
  return h;
}

function download(text, filename, type){
  var url = URL.createObjectURL(new Blob([text],{type:type}));
  var a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); },1000);

function importFile(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var incoming = JSON.parse(r.result);
      if(!incoming.entries) throw new Error("no entries");
      Object.keys(incoming.entries).forEach(function(k){
        var mine = state.entries[k], theirs = incoming.entries[k];
        if(!mine || answered(theirs) > answered(mine)) state.entries[k] = theirs;
      });
      if(incoming.marks) mergeMarks(incoming.marks);
      if(incoming.myQuotes) mergeMyQuotes(incoming.myQuotes);
      save(); render();
    } catch(e){
      statusMsg = "That file didn't look like a backup from this app."; statusErr = true; paintStatus();
