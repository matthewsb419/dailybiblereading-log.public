        if(q.c !== cat[0]) return;
        if(start < 0) start = i + 1;
        items += '<li'+(i===todayQi?' class="today"':'')+'><span class="qt">'+esc(q.t)+'</span>'+
                 '<span class="qa">— '+esc(q.a)+(i===todayQi?' <small>today</small>':'')+'</span></li>';
      });
      html += '<div class="goaltag qcat">'+esc(cat[1])+'</div><ol class="goals quotes" start="'+start+'">'+items+'</ol>';
    });
    html += '<div class="note">One of these, or one of yours, is picked for each day and shown under the reading questions on the Today tab. '+
            'Every one comes around before any repeats. Scripture is quoted from the ESV.</div></section>';
  }

  if(page === "plan"){
    // A year of the pelvic floor program. Weeks already lived show what actually happened;
    // the rest is where the program goes if each week keeps clearing half its sessions.
    var prog = kegProgram(), ws = prog.weeks, cur = ws.length - 1, WEEKS = 52, thisYear = parseKey(keyOf()).y;
    // a year of weeks runs into the next calendar year, so date labels carry it when it differs
    var planDate = function(k){ var p = parseKey(k); return shortDate(k) + (p.y !== thisYear ? " " + p.y : ""); };
    // within a row the year rides on the end date only: "Dec 30 – Jan 5 2027", "Jan 6 – Jan 12 2027"
    var planRange = function(a, b){
      var ya = parseKey(a).y, yb = parseKey(b).y;
      return shortDate(a) + (ya !== thisYear && ya !== yb ? " " + ya : "") + " – " + planDate(b);
    };
    var lvlFor = function(i){ return i < ws.length ? ws[i].lvl : prog.level + (i - cur); };
    var tenAt = null;
    for(var i0 = cur; i0 < WEEKS && tenAt === null; i0++){ if(kegLevelPlan(lvlFor(i0)).hold >= 10) tenAt = i0; }

    var p0 = prog.plan;
    html += '<section class="card"><div class="sechead"><span>Pelvic floor plan</span><span>week '+ws.length+' of '+WEEKS+'</span></div>'+
            '<div class="grow" style="margin:0 0 10px"><button type="button" class="link" id="planBack">← Back to Record</button></div>'+
            '<div class="kegsub">This week: '+esc(p0.name)+' · hold '+p0.hold+'s × '+p0.reps+', then '+p0.flicks+
            ' quick flicks, '+p0.sets+' a day · '+prog.week.done+' of '+prog.week.target+' done</div>'+
            '<div class="note">Three building weeks, then a lighter one. A week moves you up only if you finish at least '+
            'half its sessions, so the dates below shift out if a week goes short — nothing here is a deadline.'+
            (tenAt !== null ? ' Ten-second holds arrive in week '+(tenAt+1)+', the week of '+esc(planDate(shiftKey(KEG_START, tenAt*7)))+'.' : '')+
            '</div></section>';

    var block = -1;
    for(var i = 0; i < WEEKS; i++){
      var b = Math.floor(i/4);
      if(b !== block){
        block = b;
        html += '<section class="card" style="margin-top:14px"><div class="sechead"><span>Block '+(b+1)+'</span>'+
                '<span>weeks '+(b*4+1)+'–'+Math.min(WEEKS, b*4+4)+'</span></div>';
      }
      var pl = kegLevelPlan(lvlFor(i)), sK = shiftKey(KEG_START, i*7), eK = shiftKey(sK, 6);
      var cls = i < cur ? (ws[i].done >= ws[i].target/2 ? "past" : "past short") : (i === cur ? "now" : "ahead");
      if(pl.name === "Deload") cls += " deload";
      var stat = '<span class="pstat"></span>';
      if(i < cur) stat = '<span class="pstat '+(ws[i].done >= ws[i].target/2 ? "ok" : "short")+'">'+ws[i].done+'/'+ws[i].target+'</span>';
      else if(i === cur) stat = '<span class="pstat ok">'+ws[i].done+'/'+ws[i].target+'</span>';
      html += '<div class="prow '+cls+'"><span class="pn">'+(i+1)+'</span>'+
              '<span class="pmain">hold '+pl.hold+'s × '+pl.reps+' · '+pl.flicks+' flicks · '+pl.sets+' a day'+
              (pl.name === "Build" ? '' : '<span class="ptag">'+esc(pl.name)+'</span>')+
              '<span class="pwhen">'+esc(planRange(sK, eK))+
              (i === cur ? ' · this week' : '')+'</span></span>'+
              stat+'</div>';
      if(b !== Math.floor((i+1)/4) || i === WEEKS-1) html += '</section>';
    }
  }

  if(page === "next"){
    html += '<section class="card"><div class="sechead"><span>Still to come</span><span>'+NEXT_HABITS.length+' waiting</span></div>'+
            '<div class="note">One at a time. A new one only starts after everything already tracked has held for a stretch — '+
            'the point is to keep what is here, not to add faster. Nothing on this page is being tracked yet.</div></section>';
    NEXT_HABITS.forEach(function(x){
      html += '<section class="card" style="margin-top:12px"><div class="sechead"><span>'+esc(x.name)+'</span>'+
              '<span>'+esc(x.tag)+'</span></div>'+
              '<div class="kegsub"><b>'+esc(x.when)+'</b> · '+esc(x.sum)+'</div>';
      if(x.stages){
        html += '<ol class="goals nstages">';
        x.stages.forEach(function(s){ html += '<li>'+esc(s)+'</li>'; });
        html += '</ol>';
      }
      html += '</section>';
    });
  }

  app.innerHTML = html;
  wire();
}

function wire(){
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      page = b.dataset.page; statusMsg=""; calPick = null; myqDelArm = null;
      if(kegRun && kegRun.done) kegRun = null;   // the finished-session card doesn't follow you around
      var n0 = parseKey(keyOf()); viewY = n0.y; viewM = n0.m;
      render();
    };
  });
  var gr = document.getElementById("goalRead");
  if(gr) gr.onclick = function(){
    var on = gr.dataset.v !== "yes";
    gr.dataset.v = on ? "yes" : ""; gr.textContent = on ? "Read \u2713" : "Mark as read";
    document.getElementById("goalBox").classList.toggle("read", on);
    writeDraft();
  };
  // My quotes: the draft is kept in memory so a sync re-render never loses typing
  var mqt = document.getElementById("myqText"), mqb = document.getElementById("myqBy"), mqs = document.getElementById("myqSave");
  if(mqt && mqb && mqs){
    var mqInput = function(){ myqDraft.t = mqt.value; myqDraft.a = mqb.value; mqs.disabled = !mqt.value.trim(); };
    mqt.oninput = mqInput; mqb.oninput = mqInput;
    mqb.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); mqs.click(); } };
    mqs.onclick = function(){
      var t = mqt.value.trim(), a = mqb.value.trim(), now = new Date().toISOString();
      if(!t) return;
      if(!state.myQuotes) state.myQuotes = [];
      var q = myqEditId ? state.myQuotes.filter(function(x){ return x && x.id === myqEditId && !x.del; })[0] : null;
      if(q){ q.t = t; q.a = a; q.at = now; }
      else state.myQuotes.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t:t, a:a, made:now, at:now});
      myqDraft = {t:"", a:""}; myqEditId = null; myqDelArm = null;
      save(); render();
    };
  }
  var mqc = document.getElementById("myqCancel");
  if(mqc) mqc.onclick = function(){ myqEditId = null; myqDraft = {t:"", a:""}; render(); };
  document.querySelectorAll("[data-qedit]").forEach(function(b){
    b.onclick = function(){
      var q = myQuotes().filter(function(x){ return x.id === b.dataset.qedit; })[0];
      if(!q) return;
      myqEditId = q.id; myqDraft = {t:q.t, a:q.a || ""}; myqDelArm = null;
      render();
      var box = document.getElementById("myqText");
      if(box){ box.focus(); if(box.scrollIntoView) box.scrollIntoView({block:"center"}); }
    };
  });
  document.querySelectorAll("[data-qdel]").forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.qdel;
      if(myqDelArm !== id){ myqDelArm = id; render(); return; }   // first tap arms, second tap deletes
      (state.myQuotes || []).forEach(function(x){
        if(x && x.id === id){ x.del = true; x.t = ""; x.a = ""; x.at = new Date().toISOString(); }
      });
      if(myqEditId === id){ myqEditId = null; myqDraft = {t:"", a:""}; }
      myqDelArm = null;
      save(); render();
    };
  });
  var ge = document.getElementById("goalsEdit"); if(ge) ge.onclick = function(){ goalsEdit = true; render(); };
  var gc = document.getElementById("goalsCancel"); if(gc) gc.onclick = function(){ goalsEdit = false; render(); };
  var gs = document.getElementById("goalsSave");
  if(gs) gs.onclick = function(){
    var lines = document.getElementById("goalsText").value.split("\n")
      .map(function(x){ return x.replace(/^\s*\d+[.)]\s*/, "").trim(); }).filter(Boolean);
    state.goals = lines; state.goalsSavedAt = new Date().toISOString(); goalsEdit = false;
    save(); render();
  };
  ["mPrev","mNext"].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ viewY = Number(b.dataset.y); viewM = Number(b.dataset.m); calPick = null; render(); };
  });
  document.querySelectorAll("[data-dk]").forEach(function(s){
    var pick = function(){ calPick = calPick === s.dataset.dk ? null : s.dataset.dk; render(); };
    s.onclick = pick;
    s.onkeydown = function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); pick(); } };
  });
  document.querySelectorAll(".seg[data-ct] button").forEach(function(b){
    b.onclick = function(){
      setMark(b.parentNode.dataset.ct, calPick, b.classList.contains("sel") ? "" : b.dataset.v);
      render();
    };
  });
  var cc = document.getElementById("calClose"); if(cc) cc.onclick = function(){ calPick = null; render(); };
  var cs = document.getElementById("calSteps");
  if(cs){
    cs.onchange = function(){ var n = parseSteps(cs.value); setMark("st", calPick, n == null ? "" : n); render(); };
    cs.onkeydown = function(ev){ if(ev.key === "Enter") cs.blur(); };
  }
  var ck = document.getElementById("calKeg");
  if(ck){
    ck.onchange = function(){ var n = parseKeg(ck.value); setMark("kg", calPick, n == null ? "" : n); render(); };
    ck.onkeydown = function(ev){ if(ev.key === "Enter") ck.blur(); };
  }
  var po = document.getElementById("planOpen");
  if(po) po.onclick = function(){ page = "plan"; statusMsg = ""; render(); window.scrollTo(0, 0); };
  var pb = document.getElementById("planBack");
  if(pb) pb.onclick = function(){ page = "record"; statusMsg = ""; render(); window.scrollTo(0, 0); };
  var kst = document.getElementById("kegStart"); if(kst) kst.onclick = function(){ kegStart(); };
  var kpa = document.getElementById("kegPause"); if(kpa) kpa.onclick = function(){ kegPause(); };
  var kqu = document.getElementById("kegQuit"); if(kqu) kqu.onclick = function(){ kegQuit(); };
  var kdn = document.getElementById("kegDone"); if(kdn) kdn.onclick = function(){ kegRun = null; render(); };
  if(kegRun && !kegRun.done) kegPaint();
  var stIn = document.getElementById("steps");
  if(stIn){
    stIn.oninput = function(){
      statusMsg = "Saving…"; statusErr = false; paintStatus();
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ writeDraft(); }, 700);
    };
    stIn.onblur = function(){
      if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
      writeDraft();
      var n = parseSteps(stIn.value); stIn.value = n == null ? "" : fmtN(n);
    };
    stIn.onkeydown = function(ev){ if(ev.key === "Enter") stIn.blur(); };
  }
  document.querySelectorAll("#stepRange button").forEach(function(b){
    b.onclick = function(){
      stepRange = b.dataset.r;
      document.querySelectorAll("#stepRange button").forEach(function(x){ x.classList.toggle("sel", x === b); });
      drawSteps();
    };
  });
  drawSteps();
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  if(prev) prev.onclick = function(){ flush(); viewDay = Math.max(1, viewDay-1); statusMsg=""; render(); };
  if(next) next.onclick = function(){ flush(); viewDay = Math.min(PLAN.length, viewDay+1); statusMsg=""; render(); };
  var jn = document.getElementById("jumpNext");
  if(jn) jn.onclick = function(){ flush(); viewDay = nextUnloggedDay(); statusMsg=""; render(); };

  document.querySelectorAll("[data-goto]").forEach(function(b){
    b.onclick = function(){ flush(); viewDay = Number(b.dataset.goto); statusMsg=""; render(); };
  });

  document.querySelectorAll("textarea[data-q],textarea[data-x]").forEach(function(t){
    t.oninput = function(){
      statusMsg = "Saving\u2026"; statusErr = false; paintStatus();
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ writeDraft(); }, 700);
    };
    t.onblur = function(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } writeDraft(); };
  });

  document.querySelectorAll(".seg[data-t] button").forEach(function(b){
    b.onclick = function(){
      var seg = b.parentNode, was = b.classList.contains("sel");
      seg.querySelectorAll("button").forEach(function(x){ x.classList.remove("sel"); });
      if(!was) b.classList.add("sel");
      if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
      writeDraft();
    };
  });

  var sb = document.getElementById("syncBtn");
  if(sb) sb.onclick = function(){
    if(ghToken()){ syncNow(true); } else { syncOpen = true; render(); }
  };
  var sc = document.getElementById("syncCfg");
  if(sc) sc.onclick = function(){ syncOpen = true; render(); };
  var gs = document.getElementById("ghSave");
  if(gs) gs.onclick = function(){
    var v = document.getElementById("ghtok").value.trim();
    if(v){
      try { localStorage.setItem(TOKEN_KEY, v); } catch(e){}
      syncOpen = false; render(); syncNow(true);
    }
  };
  var gh = document.getElementById("ghHelp");
  if(gh) gh.onclick = function(){ syncHelpOpen = !syncHelpOpen; render(); };
  var gd = document.getElementById("ghDel");
  if(gd) gd.onclick = function(){
    try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
    syncOpen = false; render();
  };
  var gc = document.getElementById("ghClose");
  if(gc) gc.onclick = function(){ syncOpen = false; syncHelpOpen = false; render(); };

  var em = document.getElementById("expMd");
  if(em) em.onclick = function(){ download(toMarkdown(), "bible-log.md", "text/markdown"); };
  var ej = document.getElementById("expJson");
  if(ej) ej.onclick = function(){ download(JSON.stringify(state,null,2), "bible-log-backup.json", "application/json"); };
  var im = document.getElementById("imp");
  if(im) im.onclick = function(){ document.getElementById("importer").click(); };
}

function writeDraft(){
  var e = state.entries[viewDay] || { day: viewDay, date: keyOf() };
  if(staleEntry(e)){ TRACKERS.forEach(function(t){ delete e[t.id]; }); delete e.gr; delete e.st; delete e.kg; delete e.date; }
  var any = false;
  QUESTIONS.forEach(function(q){
    var node = document.querySelector('textarea[data-q="'+q.id+'"]');
    if(!node) return;
    e[q.id] = node.value;
    if(node.value.trim()) any = true;
  });
  TRACKERS.forEach(function(t){
    var seg = document.querySelector('.seg[data-t="'+t.id+'"]');
    if(!seg){ if(e[t.id]) any = true; return; } // inputs not shown for this day — keep stored values
    var sel = seg.querySelector("button.sel");
    if(sel){ e[t.id] = sel.dataset.v; any = true; }
    else delete e[t.id];
    var mk = shiftKey(e.date || keyOf(), t.shift);
    if(markVal(t.id, mk)) putMark(t.id, mk, "");   // the toggle showed the calendar mark; the entry now holds it
  });
  // steps describe the day before the entry's date, like P/M
  var sn = document.getElementById("steps");
  if(!sn){ if(hasVal("st", e.st)) any = true; }
  else {
    var sv = parseSteps(sn.value), smk = shiftKey(e.date || keyOf(), -1);
    if(sv != null){ e.st = sv; any = true; } else delete e.st;
    if(markVal("st", smk) !== undefined) putMark("st", smk, "");
  }
  // pelvic floor sessions are written by the timer, never by an input on this card
  if(hasVal("kg", e.kg)) any = true;
  // goal of the day: read acknowledgement rides on the entry
  var gb = document.getElementById("goalRead");
  if(!gb){ if(e.gr) any = true; }
  else if(gb.dataset.v === "yes"){ e.gr = "yes"; any = true; }
  else delete e.gr;
  // extra credit is optional: it keeps an entry alive but never counts toward the 3/3
  var xn = document.querySelector('textarea[data-x="ec"]');
  if(!xn){ if((e.ec||"").trim()) any = true; }       // not shown for this day — keep what is stored
  else if(xn.value.trim()){
    e.ec = xn.value; e.ecCh = Number(xn.dataset.ch); e.ecQ = Number(xn.dataset.qi);
    any = true;
  } else { delete e.ec; delete e.ecCh; delete e.ecQ; }
  if(any){
    if(!e.date) e.date = keyOf();
    e.savedAt = new Date().toISOString();
    state.entries[viewDay] = e;
  } else {
    delete state.entries[viewDay];
  }
  save();
  var pill = document.querySelector(".pill");
  if(pill){
    var n = answered(state.entries[viewDay]);
    pill.textContent = n + "/3";
    pill.className = "pill" + (n===3 ? " on" : "");
  }
  var xb = document.getElementById("xcBox");
  if(xb && xn) xb.classList.toggle("done", !!xn.value.trim());
  var sneed = document.getElementById("stepNeed");
  if(sneed) sneed.textContent = stepNeedText();
}

function flush(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(document.querySelector("textarea[data-q],textarea[data-x],input[data-s]")) writeDraft();
}

document.getElementById("importer").onchange = function(ev){
  if(ev.target.files && ev.target.files[0]) importFile(ev.target.files[0]);
  ev.target.value = "";
};
window.addEventListener("beforeunload", flush);
window.addEventListener("resize", function(){
  if(stepResize) clearTimeout(stepResize);
  stepResize = setTimeout(drawSteps, 150);
});
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    flush();
    if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; syncNow(false); }
  }
});

function boot(){
  load();
  viewDay = currentDay();
  render();
  syncNow(false);
}

function renderLock(){
  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="lock"><div class="lockcard">'+
    '<div class="eyebrow">Private</div>'+
    '<h1>Reading Log</h1>'+
    '<input type="password" id="gate" autocomplete="off" placeholder="Password">'+
    '<button id="gateGo">Open</button>'+
    '<div class="lockmsg" id="gateMsg"></div>'+
    '<div class="foot" style="opacity:.55;margin-top:16px">'+APP_VER+'</div>'+
    '</div></div>';
  var input = document.getElementById("gate");
  function attempt(){
    if(gateHash(input.value) === GATE_HASH){
      try { sessionStorage.setItem(GATE_KEY, GATE_HASH); } catch(e){}
      boot();
    } else {
      document.getElementById("gateMsg").textContent = "That's not it.";
      input.value = ""; input.focus();
    }
  }
  document.getElementById("gateGo").onclick = attempt;
  input.onkeydown = function(ev){ if(ev.key === "Enter") attempt(); };
  input.focus();
}

if(isUnlocked()) boot(); else renderLock();
buildThemePanel();
expiryBanner();
</script>
