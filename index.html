<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10151a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Reading Log</title>
<style>
:root{--ink:#10151a;--raised:#182028;--line:#2a3441;--parchment:#e6ebef;--muted:#8b98a5;--brass:#89b7d6;--rust:#c05c56;
 --ghost:#475462;--daynum:#4d5a67;--outnum:#232b33;--rustdeep:#8c3530;
 --pipline:rgba(230,235,239,.2);--piptext:rgba(230,235,239,.3);
 --pipinvline:rgba(16,21,26,.35);--pipinvtext:rgba(16,21,26,.45);--track:#10151a}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--parchment);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0 0}
#app{max-width:620px;margin:0 auto;padding:22px 18px 48px}
.serif{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif}
a{color:var(--brass)}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h1{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:30px;font-weight:600;margin:0;line-height:1.05}
.count{text-align:right;line-height:1.1;flex-shrink:0}
.count b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:28px;color:var(--brass);display:block;font-weight:400}
.count span{font-size:11px;color:var(--muted)}
nav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
 font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button.on{color:var(--brass);border-bottom-color:var(--brass)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{font-size:15px;font-weight:600}
.link{background:none;border:none;color:var(--brass);font-size:12px;padding:4px 0 0;cursor:pointer}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
 background:transparent;color:var(--parchment);font-size:16px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.3}
.stepper span{font-size:11px;color:var(--muted);min-width:52px;text-align:center}
.assign{margin:16px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.assign .ref{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:27px;color:var(--brass);line-height:1.15}
.assign .meta{font-size:12px;color:var(--muted);margin-top:5px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.35}
textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
 font-size:16px;line-height:1.5;padding:10px 11px;resize:vertical;min-height:76px;
 font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif}
textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
textarea::placeholder{color:var(--ghost)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-size:12px;color:var(--muted);min-height:16px;line-height:1.4}
.status.err{color:var(--rust)}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
 flex-shrink:0;font-variant-numeric:tabular-nums}
.pill.on{color:var(--ink);background:var(--brass);border-color:var(--brass);font-weight:600}
.sechead{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.big{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 4px}
.big .pct{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .grade{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:44px;line-height:1;color:var(--brass)}
.big .grade.off{color:var(--line)}
.sub{font-size:13px;color:var(--muted);line-height:1.45}
.bar{position:relative;height:6px;background:var(--track);border-radius:3px;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
.bar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--parchment)}
.verdict{font-size:12px;color:var(--muted)}
.verdict.on{color:var(--brass)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0 12px}
.mgrid>span{aspect-ratio:1;border-radius:5px;font-size:11px;display:flex;align-items:center;justify-content:center;
 font-variant-numeric:tabular-nums;border:1px solid var(--line);color:var(--daynum);position:relative;padding-bottom:9px}
.mgrid>span.complete{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.mgrid>span.partial{border-color:var(--brass);color:var(--brass)}
.mgrid>span.out{border-color:transparent;color:var(--outnum);padding-bottom:0}
.mgrid>span.blank{border-color:transparent;padding-bottom:0}
.mgrid>span .pd{position:absolute;top:3px;right:4px;font-size:9px;line-height:1;font-weight:500;color:var(--muted);opacity:.85}
.mgrid>span.partial .pd{color:var(--brass)}
.mgrid>span.complete .pd{color:var(--ink);opacity:.7}
.legend .pdeg{font-size:8px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 3px;margin-right:4px}
.mgrid.dowrow{margin:16px 0 0}
.mgrid.cal{margin-top:6px}
.mgrid>span.dh{aspect-ratio:auto;border:none;padding:0;color:var(--muted);font-size:10px;letter-spacing:.08em;opacity:.75}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav .eyebrow{margin-bottom:0}
.mnav button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:transparent;
 color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
.mnav button:disabled{opacity:.25}
.pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.pip{width:11px;height:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
 font-size:7px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 border:1px solid var(--pipline);color:var(--piptext)}
.pip.ok{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.pip.no{background:var(--rust);border-color:var(--rust);color:var(--parchment)}
.mgrid>span.complete .pip{border-color:var(--pipinvline);color:var(--pipinvtext)}
.mgrid>span.complete .pip.ok{background:var(--ink);border-color:var(--ink);color:var(--brass)}
.mgrid>span.complete .pip.no{background:var(--rustdeep);border-color:var(--rustdeep);color:var(--parchment)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.sw.c{background:var(--brass);border-color:var(--brass)}
.sw.p{border-color:var(--brass)}
.weekrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:block}
.dots i.complete{background:var(--brass);border-color:var(--brass)}
.dots i.partial{border-color:var(--brass)}
.wnum{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
.wnum small{font-size:13px;color:var(--muted);margin-left:8px}
.wnum small.on{color:var(--brass)}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-left:2px solid var(--line);padding-left:9px;line-height:1.45}
.totals{display:flex;justify-content:space-between;gap:10px}
.totals b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:26px;color:var(--brass);
 line-height:1.1;display:block;font-weight:400}
.totals span{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.row{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:baseline;width:100%;text-align:left;
 background:none;border:none;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;color:var(--parchment)}
.row .d{font-size:12px;color:var(--muted)}
.row .r{font-size:13px;color:var(--brass);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .m{font-size:11px;color:var(--muted);text-align:right}
.row .m.on{color:var(--brass)}
.mrow{display:grid;grid-template-columns:1fr 52px 60px 34px;gap:8px;align-items:baseline;
 border-bottom:1px solid var(--line);padding:11px 2px}
.mrow .n{font-size:13px}
.mrow .f,.mrow .p{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mrow .p.on{color:var(--brass)}
.mrow .g{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:16px;color:var(--brass);text-align:right}
.actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:104px;padding:11px 12px;border-radius:8px;border:1px solid var(--brass);
 background:transparent;color:var(--brass);font-size:13px;cursor:pointer}
.actions button.quiet{border-color:var(--line);color:var(--muted)}
.foot{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
.hidden{display:none}
.tok{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
 font-size:14px;padding:10px 11px;margin-top:4px}
.tok:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.themes{position:fixed;right:14px;top:76px;width:176px;background:var(--raised);border:1px solid var(--line);
 border-radius:10px;padding:10px;z-index:50;max-height:calc(100vh - 100px);overflow-y:auto}
.themes h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
 font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.themes h3 span{cursor:pointer;text-decoration:underline;font-weight:400;letter-spacing:0;text-transform:none}
.throw{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;border-radius:7px;
 padding:7px 8px;cursor:pointer;font-size:12px;text-align:left;margin-bottom:4px}
.throw.on{box-shadow:0 0 0 2px var(--brass)}
.thsw{display:flex;gap:3px;flex:none}
.thsw i{width:12px;height:12px;border-radius:4px;display:block}
.thrand{display:block;width:100%;margin-bottom:8px;padding:8px 10px;border-radius:7px;border:1px dashed var(--brass);
 background:transparent;color:var(--brass);font-size:12px;letter-spacing:.04em;cursor:pointer}
.thgrp{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;
 color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 4px 6px;cursor:pointer}
.thgrp i{font-style:normal;font-size:10px;opacity:.7}
.thgrp .arr{font-weight:400}
.thgbody{display:none}
.thgbody.open{display:block}
.themes.min .throw,.themes.min .thrand,.themes.min .thgrp,.themes.min .thgbody{display:none}
.themes.min{max-height:none;overflow:visible}
.themes.min h3{margin-bottom:0}
.expbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;
 gap:14px;background:var(--rust);color:var(--parchment);font-size:13px;padding:10px 44px 10px 14px;line-height:1.45;
 text-align:center}
.expbar button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
 color:var(--parchment);font-size:20px;cursor:pointer;line-height:1;padding:6px}
@media (max-width:1080px){
 .themes{left:12px;right:12px;top:auto;bottom:12px;width:auto;display:flex;flex-wrap:wrap;gap:4px;max-height:36vh}
 .themes h3{width:100%;margin-bottom:4px}
 .throw{width:auto;flex:1 1 40%;margin-bottom:0}
}
.lock{min-height:76vh;display:flex;align-items:center;justify-content:center}
.lockcard{width:100%;max-width:300px;text-align:center}
.lockcard h1{margin-bottom:22px}
.lockcard input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:8px;
 color:var(--parchment);font-size:18px;padding:12px;text-align:center;letter-spacing:.12em}
.lockcard input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent}
.lockcard button{width:100%;margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--brass);
 background:transparent;color:var(--brass);font-size:14px;letter-spacing:.06em;cursor:pointer}
.lockmsg{font-size:12px;color:var(--rust);min-height:16px;margin-top:10px}
.pmwrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
 margin:2px 0 14px;padding:12px 2px 0;border-top:1px solid var(--line)}
.pmhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost)}
.pmset{display:flex;gap:16px;align-items:center}
.pmitem{display:flex;align-items:center;gap:7px}
.pmlab{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--ghost);font-size:12px;padding:5px 13px;cursor:pointer;
 letter-spacing:.03em;transition:background .15s,color .15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.sel{font-weight:600}
.seg button.sel[data-v="no"]{background:var(--brass);color:var(--ink)}
.seg button.sel[data-v="yes"]{background:var(--rust);color:var(--parchment)}
.trows{margin:8px 0 2px}
.trow{display:grid;grid-template-columns:58px 1fr 50px 28px;gap:10px;align-items:center;padding:6px 0}
.tlab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trow .bar{margin:0;height:5px}
.trow .bar u{height:11px;top:-3px}
.tpct{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tgr{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px;color:var(--brass);text-align:right}
.bar i.alt{background:var(--parchment)}
.weekrow .tlab{width:58px;flex:none}
.weekrow .dots{margin-right:auto}
.weekrow{padding:5px 0}
.weekrow .wnum{font-size:17px;min-width:66px;text-align:right}
.dots i.fail{background:var(--rust);border-color:var(--rust)}
.arow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;
 border-bottom:1px solid var(--line)}
.arow .det{font-size:12px;color:var(--muted)}
.apct{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:18px;color:var(--parchment)}
.apct.on{color:var(--brass)}
.mrow4{display:grid;grid-template-columns:1fr 76px 66px 66px;gap:8px;align-items:baseline;
 border-bottom:1px solid var(--line);padding:11px 2px}
.mrow4 .n{font-size:13px}
.mrow4 .p{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mrow4 .p.on{color:var(--brass)}
.mrow4 .p b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:13px;font-weight:400;
 color:var(--brass);margin-left:5px}
.apct b{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:15px;font-weight:400;
 color:var(--brass);margin-left:7px}
.mrow4.hd{border-bottom:none;padding:0 2px 2px}
.mrow4.hd span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.xc{margin:4px 0 16px;padding:13px 14px;border:1px dashed var(--brass);border-radius:10px}
.xc.done{border-style:solid}
.xchead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.xctag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.xcopt{font-size:11px;color:var(--muted);flex-shrink:0}
.xcref{font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;font-size:20px;color:var(--brass);
 line-height:1.15;margin-top:7px}
.xcmeta{font-size:11px;color:var(--muted);margin-top:3px}
.xcq{font-size:14px;line-height:1.5;margin:11px 0 8px}
.xc textarea{min-height:64px}
.xclock{margin:4px 0 16px;padding:11px 14px;border:1px dashed var(--line);border-radius:10px;
 font-size:12px;color:var(--ghost);line-height:1.45}
.ecsum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.ecsum .det{font-size:12px;color:var(--muted);line-height:1.45}
.ecsum .apct{flex-shrink:0}
</style>
</head>

function buildPlan(){
  var days=[];
  ORDER.forEach(function(seg){
    var name=seg[0], from=seg[1], to=seg[2];
    var chapters=BOOKS[name][0], verses=BOOKS[name][1], avg=verses/chapters;
    function vOf(c){ var k=name+":"+c; return LONG[k]!==undefined?LONG[k]:avg; }
    var groups=[], c=from;
    while(c<=to){
      var start=c, v=vOf(c); c++;
      while(c<=to && v+vOf(c)<=CEIL){ v+=vOf(c); c++; }
      groups.push([start,c-1,v]);
    }
    if(groups.length>1 && groups[groups.length-1][2]<MINV){
      var last=groups.pop(), prev=groups[groups.length-1];
      if(prev[2]+last[2]<=CEIL+18){ prev[1]=last[1]; prev[2]+=last[2]; } else groups.push(last);
    }
    groups.forEach(function(g){
      days.push({book:name,
        read: g[0]===g[1] ? name+" "+g[0] : name+" "+g[0]+"\u2013"+g[1],
        verses: Math.round(g[2]),
        min: Math.max(1, Math.round(g[2]/VPM))});
    });
  });
  return days.map(function(d,i){ d.day=i+1; return d; });
}

function hexNum(c){ return parseInt(c.slice(1),16); }
function blendHex(a,b,t){
  var A = hexNum(a), B = hexNum(b);
  var r = Math.round(((A>>16)&255)*(1-t)+((B>>16)&255)*t);
  var g = Math.round(((A>>8)&255)*(1-t)+((B>>8)&255)*t);
  var bl = Math.round((A&255)*(1-t)+(B&255)*t);
  return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function rgbaOf(c,a){
  var A = hexNum(c);
  return "rgba("+((A>>16)&255)+","+((A>>8)&255)+","+(A&255)+","+a+")";
}

var SYNC_REPO = "matthewsb419/dailybiblereading-data";
var SYNC_URL = "https://api.github.com/repos/"+SYNC_REPO+"/contents/data.json";
var TOKEN_KEY = "bibleLog.ghtoken";
var TOKEN_EXPIRES = "2026-12-04"; // update this date whenever a new token is created
var syncSha = null, pushTimer = null, syncOpen = false, syncBusy = false, syncHelpOpen = false;

function ghToken(){ try { return localStorage.getItem(TOKEN_KEY) || ""; } catch(e){ return ""; } }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\n/g,"")))); }
function setSyncStatus(msg, err){ statusMsg = msg; statusErr = !!err; paintStatus(); }

function mergeRemote(remote){
  // per entry, the most recently edited copy wins
  var changed = false;
  if(remote && remote.entries){
    Object.keys(remote.entries).forEach(function(k){
      var mine = state.entries[k], theirs = remote.entries[k];
      if(!mine || (theirs.savedAt||"") > (mine.savedAt||"")){ state.entries[k] = theirs; changed = true; }
    });
  }
  return changed;
}

function syncNow(manual){
  if(!ghToken() || syncBusy || typeof fetch === "undefined") return;
  syncBusy = true;
  if(manual) setSyncStatus("Syncing…");
  var hdrs = {Authorization:"Bearer "+ghToken(), Accept:"application/vnd.github+json"};
  fetch(SYNC_URL, {headers:hdrs})
  .then(function(r){
    if(r.status === 404){ syncSha = null; return null; }
    if(r.status === 401) throw new Error("GitHub says the token is invalid — re-copy the exact github_pat value and paste it again");
    if(r.status === 403) throw new Error("token lacks permission — set Contents to Read and write on the data repo");
    if(!r.ok) throw new Error("pull failed ("+r.status+")");
    return r.json();
  })
  .then(function(j){
    var remoteText = "";
    if(j){
      syncSha = j.sha;
      remoteText = b64dec(j.content);
      var changed = false;
      try { changed = mergeRemote(JSON.parse(remoteText)); } catch(e){}
      if(changed){
        if(page === "today" && !document.querySelector("textarea:focus")) viewDay = currentDay();
        save(); render();
      }
    }
    var localText = JSON.stringify(state);
    if(localText === remoteText){ syncBusy = false; setSyncStatus("Synced"); return null; }
    var body = {message:"sync "+new Date().toISOString(), content:b64enc(localText)};
    if(syncSha) body.sha = syncSha;
    return fetch(SYNC_URL, {method:"PUT", headers:hdrs, body:JSON.stringify(body)})
      .then(function(r){
        if(r.status === 409 || r.status === 422){ syncBusy = false; syncSha = null; syncNow(manual); return null; }
        if(r.status === 404 || r.status === 403) throw new Error("token can't write the data repo — grant it access to "+SYNC_REPO+" with Contents read and write");
        if(!r.ok) throw new Error("push failed ("+r.status+")");
        return r.json();
      })
      .then(function(j2){
        if(j2){ if(j2.content) syncSha = j2.content.sha; syncBusy = false; setSyncStatus("Synced"); }
      });
  })
  .catch(function(e){ syncBusy = false; setSyncStatus("Sync: "+e.message, true); });
}
function schedulePush(){
  if(!ghToken()) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = null; syncNow(false); }, 2500);
}

function ecOffset(dateKey){
  return Math.round((asDate(dateKey) - asDate(EC_START))/86400000);
}
function ecBank(ch){ return EC_QUESTIONS[ch-1] || []; }
function ecFor(dateKey){
  // what the extra credit is on a given calendar date, or null if outside the run
  if(!dateKey || dateKey < EC_START || dateKey > EC_END) return null;
  var n = ecOffset(dateKey);
  if(n < 0) return null;
  var ch = (n % EC_CYCLE) + 1;
  var cycle = Math.floor(n / EC_CYCLE);
  var bank = ecBank(ch);
  if(!bank.length) return null;
  var qi = cycle % bank.length;
  return {n:n, ch:ch, cycle:cycle, qi:qi, q:bank[qi],
          ref:"1 Timothy "+ch, week:Math.floor(n/7)+1, pass:cycle+1};
}
function ecStored(entry){
  // an answer already written keeps its own chapter and question, whatever the date now says
  if(!entry || !(entry.ec||"").trim() || !entry.ecCh) return null;
  var ch = Number(entry.ecCh), qi = Number(entry.ecQ)||0, bank = ecBank(ch);
  return {ch:ch, qi:qi, q:bank[qi] || "", ref:"1 Timothy "+ch, cycle:null, pass:null};
}
function ecDays(){
  // calendar days in the run so far: EC_START through today (capped at Christmas Eve)
  var today = keyOf(), last = today < EC_END ? today : EC_END;
  if(last < EC_START) return 0;
  return ecOffset(last) + 1;
}
function ecMap(){
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || !(e.ec||"").trim()) return;
    var cur = m[e.date];
    if(!cur || (e.savedAt||"") > (cur.savedAt||"")) m[e.date] = e;
  });
  return m;
}

/* ---------- dates ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ d=d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseKey(k){ var p=k.split("-").map(Number); return {y:p[0],m:p[1],d:p[2]}; }
function asDate(k){ var p=parseKey(k); return new Date(p.y,p.m-1,p.d); }
function prettyDate(k){ return asDate(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }
function shortDate(k){ return asDate(k).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function monthName(y,m){ return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

var GRADES=[[96,"A+"],[93,"A"],[90,"A\u2212"],[87,"B+"],[83,"B"],[80,"B\u2212"],
            [77,"C+"],[73,"C"],[70,"C\u2212"],[67,"D+"],[63,"D"],[60,"D\u2212"]];
function gradeFor(p){ for(var i=0;i<GRADES.length;i++){ if(p>=GRADES[i][0]) return GRADES[i][1]; } return "F"; }

/* ---------- storage ---------- */
var LS_KEY = "bibleLog.v1";
var state = { version:1, entries:{} };   // entries keyed by PLAN DAY number

var viewY = _now0.y, viewM = _now0.m;

function load(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if(raw) state = JSON.parse(raw);
    if(!state.entries) state.entries = {};
  } catch(e){
    statusMsg = "Couldn't read saved data from this browser."; statusErr = true;
  }
}
function save(){
  try {

    statusMsg = "Saved on this device"; statusErr = false;
  } catch(e){
    statusMsg = "Couldn't save \u2014 browser storage is full or blocked. Export your notes now.";
    statusErr = true;
  }

}

function isComplete(e){
  if(!e) return false;
  return QUESTIONS.every(function(q){ return (e[q.id]||"").trim().length>0; });
}
function answered(e){
  if(!e) return 0;
  return QUESTIONS.filter(function(q){ return (e[q.id]||"").trim().length>0; }).length;
}
function loggedDays(){
  return Object.keys(state.entries).map(Number).sort(function(a,b){return a-b;});
}
function nextUnloggedDay(){
  // first plan day with no written answers — P/M-only marks on a missed day don't count as read
  for(var d=1; d<=PLAN.length; d++){
    if(answered(state.entries[d]) === 0) return d;
  }
  return PLAN.length;
}
function currentDay(){
  // today's working day: the first day that is unwritten OR was written today.
  // Writing ahead (posts for later days) never moves this until the calendar rolls over.
  var today = keyOf();
  for(var d=1; d<=PLAN.length; d++){
    var e = state.entries[d];
    if(!e || answered(e) === 0 || e.date === today) return d;
  }
  return PLAN.length;
}

/* ---------- scoring (by calendar date) ---------- */
function dateMap(){
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date) return;
    var cur = m[e.date];
    if(!cur || answered(e) > answered(cur)) m[e.date] = e;
  });
  return m;
}
function planDayMap(){
  // calendar date -> plan day number of the entry shown on that date (mirrors dateMap)
  var best = {}, out = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date) return;
    var cur = best[e.date];
    if(!cur || answered(e) > answered(cur)){ best[e.date] = e; out[e.date] = Number(k); }
  });
  return out;
}
function firstDate(){
  var ds = Object.keys(dateMap()).sort();
  return ds.length ? ds[0] : null;
}
function monthStats(y,m){
  var start = firstDate(); if(!start) return null;
  var dm = dateMap(), s = parseKey(start), now = parseKey(keyOf());
  var first = (y===s.y && m===s.m) ? s.d : 1;
  var last  = (y===now.y && m===now.m) ? now.d : daysInMonth(y,m);
  var elapsed = last-first+1, complete=0, partial=0, marks={};
  for(var d=first; d<=last; d++){
    var e = dm[y+"-"+pad(m)+"-"+pad(d)];
    if(isComplete(e)){ complete++; marks[d]="complete"; }
    else if(e && answered(e)>0){ partial++; marks[d]="partial"; }
    else marks[d]="missed";
  }
  return {y:y,m:m,first:first,last:last,elapsed:elapsed,complete:complete,partial:partial,
          marks:marks, pct: elapsed>0 ? (complete/elapsed)*100 : 0};
}
function allMonths(){
  var start = firstDate(); if(!start) return [];
  var s = parseKey(start), now = parseKey(keyOf()), out=[], y=s.y, m=s.m;
  while(y<now.y || (y===now.y && m<=now.m)){ out.push(monthStats(y,m)); m++; if(m>12){m=1;y++;} }
  return out.reverse();
}
function weekStats(){
  var start = firstDate(); if(!start) return null;
  var dm = dateMap(), sd = asDate(start), now = parseKey(keyOf()), days=[];
  for(var i=6;i>=0;i--){
    var d = new Date(now.y, now.m-1, now.d-i);
    if(d < sd) continue;
    var k = keyOf(d), e = dm[k];
    days.push({k:k, state: isComplete(e) ? "complete" : (e && answered(e)>0 ? "partial" : "missed")});
  }
  var complete = days.filter(function(x){return x.state==="complete";}).length;
  return {days:days, complete:complete, elapsed:days.length,
          pct: days.length ? (complete/days.length)*100 : 0};
}

/* ---------- tracker scoring (by the day the answer describes) ---------- */
function yKey(){ var d = new Date(); d.setDate(d.getDate()-1); return keyOf(d); }
function pmMap(f){
  // each entry's answer describes the day BEFORE the entry's date
  var m = {};
  Object.keys(state.entries).forEach(function(k){
    var e = state.entries[k];
    if(!e.date || (e[f]!=="yes" && e[f]!=="no")) return;
    var d = asDate(e.date); d.setDate(d.getDate()-1);
    var key = keyOf(d), cur = m[key];
    if(!cur || (e.savedAt||"") > (cur.savedAt||"")) m[key] = {v:e[f], savedAt:e.savedAt};
  });
  var out = {};
  Object.keys(m).forEach(function(k){ out[k] = m[k].v; });
  return out;
}
function pmFirst(map){
  var ds = Object.keys(map).sort();
  return ds.length ? ds[0] : null;
}
function pmMonthStats(map, first, y, m){
  var s = parseKey(first), now = parseKey(yKey());
  if(y>now.y || (y===now.y && m>now.m)) return null;
  if(y<s.y || (y===s.y && m<s.m)) return null;
  var a = (y===s.y && m===s.m) ? s.d : 1;
  var b = (y===now.y && m===now.m) ? now.d : daysInMonth(y,m);
  if(b < a) return null;
  var clean = 0;
  for(var d=a; d<=b; d++){
    if(map[y+"-"+pad(m)+"-"+pad(d)]==="no") clean++;
  }
  var el = b-a+1;
  return {clean:clean, elapsed:el, pct: el>0 ? (clean/el)*100 : 0};
}
function tWeek(map, first){
  var sd = asDate(first), now = parseKey(yKey()), out=[], n=0;
  for(var i=6;i>=0;i--){
    var d = new Date(now.y, now.m-1, now.d-i);
    if(d < sd) continue;
    var k = keyOf(d), v = map[k];
    out.push({k:k, state: v==="no" ? "complete" : (v==="yes" ? "fail" : "missed")});
    if(v==="no") n++;
  }
  return {days:out, n:n, elapsed:out.length, pct: out.length ? (n/out.length)*100 : 0};
}

/* ---------- export / import ---------- */
function toMarkdown(){
  var lines = ["# Bible reading log",""];
  loggedDays().forEach(function(n){
    var e = state.entries[n], p = PLAN[n-1];
    lines.push("## Day "+n+" \u2014 "+p.read+(e.date ? " \u2014 "+prettyDate(e.date) : ""), "");
    QUESTIONS.forEach(function(q){
      if((e[q.id]||"").trim()) lines.push("**"+q.prompt+"**","",e[q.id].trim(),"");
    });
    var xs = ecStored(e);
    if(xs){
      lines.push("**Extra credit — "+xs.ref+"**","",xs.q,"",e.ec.trim(),"");
    }
  });
  return lines.join("\n");
}
function download(text, filename, type){
  var url = URL.createObjectURL(new Blob([text],{type:type}));
  var a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importFile(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var incoming = JSON.parse(r.result);
      if(!incoming.entries) throw new Error("no entries");
      Object.keys(incoming.entries).forEach(function(k){
        var mine = state.entries[k], theirs = incoming.entries[k];
        if(!mine || answered(theirs) > answered(mine)) state.entries[k] = theirs;
      });
      save(); render();
    } catch(e){
      statusMsg = "That file didn't look like a backup from this app."; statusErr = true; paintStatus();
    }
  };
  r.readAsText(file);
}

      html += '</div></div>';
    }

    var n = answered(entry);
    html += '<div class="cardfoot"><div id="status" class="status'+(statusErr?" err":"")+'">'+
            esc(statusMsg || (n ? "Saved on this device" : "Nothing written yet"))+'</div>'+
            '<div class="pill'+(n===3?" on":"")+'">'+n+'/3</div></div></section>';

    var ds = loggedDays().reverse().slice(0,14);
    if(ds.length){
      html += '<section style="margin-top:20px"><div class="sechead"><span>Recent</span></div>';
      ds.forEach(function(num){
        var e = state.entries[num];
        html += '<button class="row" data-goto="'+num+'">'+
                '<span class="d">'+(e.date?esc(shortDate(e.date)):"Day "+num)+'</span>'+
                '<span class="r">'+esc(PLAN[num-1].read)+'</span>'+
                '<span class="m'+(isComplete(e)?" on":"")+'">'+(isComplete(e)?"3/3":answered(e)+"/3")+'</span></button>';
      });
      html += '</section>';
    }

    html += '<div class="actions">'+
            '<button id="expMd">Download notes</button>'+
            '<button id="expJson">Download backup</button>'+
            '<button id="imp" class="quiet">Restore backup</button>'+
            '<button id="syncBtn" class="quiet">'+(ghToken() ? "Sync now" : "Set up sync")+'</button></div>';

    if(syncOpen){
      html += '<section class="card" style="margin-top:14px"><div class="sechead"><span>Sync</span></div>'+
              '<label for="ghtok">Paste a fine-grained GitHub token with Contents read &amp; write on '+
              esc(SYNC_REPO)+'. It is stored only on this device.</label>'+
              '<input type="password" id="ghtok" class="tok" autocomplete="off" placeholder="'+
              (ghToken() ? "Token saved — paste a new one to replace it" : "github_pat_…")+'">'+
              '<div class="actions" style="margin-top:12px">'+
              '<button id="ghSave">Save token</button>'+
              '<button id="ghHelp" class="quiet">'+(syncHelpOpen?"Hide instructions":"How to make a token")+'</button>'+
              (ghToken() ? '<button id="ghDel" class="quiet">Remove token</button>' : '')+
              '<button id="ghClose" class="quiet">Close</button></div>';
      if(syncHelpOpen){
        html += '<div class="note" style="margin-top:14px"><b style="color:var(--parchment)">Making a new sync token</b>'+
          '<ol style="margin:8px 0 0;padding-left:18px;line-height:1.7">'+
          '<li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">'+
          'github.com/settings/personal-access-tokens/new</a> and sign in if asked. (Long way: github.com &rarr; '+
          'your avatar &rarr; Settings &rarr; Developer settings at the bottom left &rarr; Personal access tokens '+
          '&rarr; Fine-grained tokens &rarr; Generate new token.)</li>'+
          '<li>Token name: <b>bible-log-sync</b>. Expiration: the longest offered &mdash; note the date.</li>'+
          '<li>Repository access: choose <b>Only select repositories</b>, then pick <b>dailybiblereading-data</b> '+
          'in the dropdown. It should say &ldquo;1 repository selected.&rdquo;</li>'+
          '<li>Scroll down &mdash; a <b>Repository permissions</b> list appears only after step 3. '+
          'Set <b>Contents</b> to <b>Read and write</b>. Touch nothing else.</li>'+
          '<li>Check the summary above the button: <b>2 permissions &mdash; Contents (read and write), '+
          'Metadata (read)</b>. Metadata adds itself; that is normal.</li>'+
          '<li>Generate the token and copy the <b>github_pat_&hellip;</b> value right away &mdash; '+
          'GitHub shows it only this once.</li>'+
          '<li>Paste it in the box above and press Save token. Do the same paste on each device '+
          '(one token works everywhere).</li></ol>'+
          '<div style="margin-top:8px">If the old token expired, delete it on that same GitHub page &mdash; '+
          'nothing in the app breaks; entries just pause syncing until the new token is saved.</div></div>';
      }
      html += '</section>';
    }

    html += '<p class="foot">'+
            (ghToken() ? 'Syncing with a private GitHub repo — your other devices pick up changes when they open the app. '
                       : 'Saved in this browser on this device. Set up sync to share entries with your phone. ')+
            'Backups still work anytime.'+
            (ghToken() ? ' <button class="link" id="syncCfg">Sync settings</button>' : '')+
            ' · '+APP_VER+'</p>';
  }

  if(page === "record"){
    var months = allMonths();
    if(!months.length){
      html += '<section class="card" style="color:var(--muted);font-size:14px;line-height:1.5">'+
              'Nothing scored yet. Answer all three questions on a day and it starts counting.</section>';
    } else {
      var wk = weekStats();
      var dm = dateMap();
      var totalComplete = Object.keys(dm).filter(function(k){ return isComplete(dm[k]); }).length;
      var start = firstDate();
      var totalElapsed = Math.round((asDate(keyOf()) - asDate(start))/86400000) + 1;

      var pMapv = pmMap("p"), mMapv = pmMap("m");
      var pF = pmFirst(pMapv), mF = pmFirst(mMapv);

      var nowP = parseKey(keyOf());
      var minKey = [start, pF, mF].filter(Boolean).sort()[0];
      var minP = parseKey(minKey);
      if(viewY < minP.y || (viewY === minP.y && viewM < minP.m)){ viewY = minP.y; viewM = minP.m; }
      if(viewY > nowP.y || (viewY === nowP.y && viewM > nowP.m)){ viewY = nowP.y; viewM = nowP.m; }
      var atMin = viewY === minP.y && viewM === minP.m;
      var atMax = viewY === nowP.y && viewM === nowP.m;
      var sP = parseKey(start);
      var tm = (viewY > sP.y || (viewY === sP.y && viewM >= sP.m)) ? monthStats(viewY, viewM) : null;
      var pMS = pF ? pmMonthStats(pMapv, pF, viewY, viewM) : null;
      var mMS = mF ? pmMonthStats(mMapv, mF, viewY, viewM) : null;

      var barRow = function(lab, ms, alt){
        if(!ms) return '<div class="trow"><span class="tlab">'+lab+'</span>'+
                       '<div class="bar sm"></div><span class="tpct">\u2014</span><span class="tgr">\u2014</span></div>';
        return '<div class="trow"><span class="tlab">'+lab+'</span>'+
               '<div class="bar sm"><i'+(alt?' class="alt"':'')+' style="width:'+Math.min(100,ms.pct)+'%"></i>'+
               '<u style="left:'+MONTH_TARGET+'%"></u></div>'+
               '<span class="tpct">'+ms.pct.toFixed(1)+'%</span>'+
               '<span class="tgr">'+(ms.elapsed<GRADE_FLOOR ? "\u2014" : gradeFor(ms.pct))+'</span></div>';
      };
      var pip = function(v, lab){
        return '<b class="pip'+(v==="no" ? " ok" : (v==="yes" ? " no" : ""))+'">'+lab+'</b>';
      };

      var pm1 = viewM===1 ? {y:viewY-1,m:12} : {y:viewY,m:viewM-1};
      var nm1 = viewM===12 ? {y:viewY+1,m:1} : {y:viewY,m:viewM+1};
      html += '<section class="card">'+
              '<div class="mnav"><button id="mPrev" data-y="'+pm1.y+'" data-m="'+pm1.m+'"'+(atMin?' disabled':'')+
              ' aria-label="Previous month">&#8249;</button>'+
              '<div class="eyebrow">'+esc(monthName(viewY,viewM))+'</div>'+
              '<button id="mNext" data-y="'+nm1.y+'" data-m="'+nm1.m+'"'+(atMax?' disabled':'')+
              ' aria-label="Next month">&#8250;</button></div>'+
              '<div class="trows">'+
              barRow("Reading", tm, false)+
              barRow("P", pMS, true)+
              barRow("M", mMS, true)+
              '</div>';

      html += '<div class="mgrid dowrow">';
      ["S","M","T","W","T","F","S"].forEach(function(x){ html += '<span class="dh">'+x+'</span>'; });
      html += '</div><div class="mgrid cal">';
      var pdm = planDayMap(), todayKey = keyOf(), curD = currentDay();
      var lead = new Date(viewY, viewM-1, 1).getDay();
      for(var bl=0; bl<lead; bl++) html += '<span class="blank"></span>';
      for(var d=1; d<=daysInMonth(viewY,viewM); d++){
        var dk = viewY+"-"+pad(viewM)+"-"+pad(d);
        var pv = pMapv[dk], mv = mMapv[dk];
        var inR = tm && d>=tm.first && d<=tm.last;
        var cls = inR ? tm.marks[d] : ((pv||mv) ? "missed" : "out");
        var pips = cls!=="out" ? '<span class="pips">'+pip(pv,"P")+pip(mv,"M")+'</span>' : '';
        var pdn = pdm[dk] || (dk===todayKey && cls!=="out" ? curD : 0);
        var pdTag = pdn ? '<span class="pd" title="Reading day '+pdn+'">'+pdn+'</span>' : '';
        html += '<span class="'+cls+'">'+d+pdTag+pips+'</span>';
      }
      html += '</div><div class="legend">'+
              '<span><i class="sw c"></i>All three</span>'+
              '<span><i class="sw p"></i>Partial</span>'+
              '<span><i class="sw"></i>Missed</span>'+
              '<span><b class="pip ok">P</b>No</span>'+
              '<span><b class="pip no">M</b>Yes</span>'+
              '<span><b class="pdeg">8</b>Reading day</span></div></section>';

      var weekRow = function(lab, days, n, elapsed, pct){
        var dots = '';
        days.forEach(function(x){ dots += '<i class="'+x.state+'" title="'+esc(shortDate(x.k))+'"></i>'; });
        return '<div class="weekrow"><span class="tlab">'+lab+'</span><div class="dots">'+dots+'</div>'+
               '<div class="wnum">'+n+'/'+elapsed+
               '<small class="'+(pct>=WEEK_TARGET?"on":"")+'">'+pct.toFixed(0)+'%</small></div></div>';
      };
      html += '<section class="card"><div class="sechead"><span>Last 7 days</span></div>';
      html += weekRow("Reading", wk.days, wk.complete, wk.elapsed, wk.pct);
      var pWk = pF ? tWeek(pMapv, pF) : null;
      var mWk = mF ? tWeek(mMapv, mF) : null;
      if(pWk) html += weekRow("P", pWk.days, pWk.n, pWk.elapsed, pWk.pct);
      if(mWk) html += weekRow("M", mWk.days, mWk.n, mWk.elapsed, mWk.pct);
      html += '<div class="note">Rolling seven days, not Sunday-to-Saturday. '+
              'P and M run a day behind \u2014 each answer lands on the day it describes.</div></section>';

      var aRow = function(lab, n, el, sinceKey){
        var pct = el>0 ? (n/el)*100 : 0;
        return '<div class="arow"><span class="tlab">'+lab+'</span>'+
               '<span class="det">'+n+' of '+el+' days \u00b7 since '+esc(shortDate(sinceKey))+'</span>'+
               '<span class="apct'+(pct>=MONTH_TARGET?" on":"")+'">'+pct.toFixed(1)+'%'+
               '<b>'+(el<GRADE_FLOOR?"\u2014":gradeFor(pct))+'</b></span></div>';
      };
      html += '<section class="card"><div class="sechead"><span>All time</span></div>';
      html += aRow("Reading", totalComplete, totalElapsed, start);
      if(pF){
        var pClean = Object.keys(pMapv).filter(function(k){ return pMapv[k]==="no"; }).length;
        html += aRow("P", pClean, Math.round((asDate(yKey()) - asDate(pF))/86400000) + 1, pF);
      }
      if(mF){
        var mClean = Object.keys(mMapv).filter(function(k){ return mMapv[k]==="no"; }).length;
        html += aRow("M", mClean, Math.round((asDate(yKey()) - asDate(mF))/86400000) + 1, mF);
      }
      html += '<div class="bar" style="margin-top:16px">'+
              '<i style="width:'+Math.min(100,(totalComplete/YEAR_GOAL)*100)+'%"></i></div>'+
              '<div class="sub">'+totalComplete+' of '+YEAR_GOAL+' reading days toward the year</div></section>';

      if(months.length){
        html += '<section style="margin-top:20px"><div class="sechead"><span>By month</span></div>'+
                '<div class="mrow4 hd"><span></span><span>Read</span><span>P</span><span>M</span></div>';
        months.forEach(function(ms){
          var pp = pF ? pmMonthStats(pMapv, pF, ms.y, ms.m) : null;
          var mm = mF ? pmMonthStats(mMapv, mF, ms.y, ms.m) : null;
          var cell = function(x){
            if(!x) return '<span class="p">\u2014</span>';
            return '<span class="p'+(x.pct>=MONTH_TARGET?" on":"")+'">'+x.pct.toFixed(0)+'%'+
                   '<b>'+(x.elapsed<GRADE_FLOOR?"\u2014":gradeFor(x.pct))+'</b></span>';
          };
          html += '<div class="mrow4"><span class="n">'+esc(monthName(ms.y,ms.m))+'</span>'+
                  cell(ms)+cell(pp)+cell(mm)+'</div>';
        });
        html += '</section>';
      }
    }

    // Extra credit stands apart — it is optional and never touches a grade above.
    var ecEl = ecDays();
    if(ecEl > 0){
      var em0 = ecMap();
      var ecDone = Object.keys(em0).filter(function(k){ return k >= EC_START && k <= EC_END; }).length;
      var ecPct = (ecDone/ecEl)*100;
      var ecDots = '', ecN = 0;
      var nowE = parseKey(keyOf());
      for(var i7=6; i7>=0; i7--){
        var de = new Date(nowE.y, nowE.m-1, nowE.d-i7), ke = keyOf(de);
        if(ke < EC_START || ke > EC_END) continue;
        var hit = !!em0[ke];
        if(hit) ecN++;
        ecDots += '<i class="'+(hit?"complete":"")+'" title="'+esc(shortDate(ke))+'"></i>';
      }
      var ecTotal = ecOffset(EC_END) + 1;
      var ecLeft = ecTotal - ecEl;
      html += '<section class="card" style="margin-top:20px">'+
              '<div class="sechead"><span>Extra credit · 1 Timothy</span><span>'+
              (ecLeft > 0 ? ecLeft+' day'+(ecLeft===1?'':'s')+' to Christmas Eve' : 'Run complete')+
              '</span></div>'+
              '<div class="weekrow"><span class="tlab">Last 7</span>'+
              '<div class="dots">'+ecDots+'</div>'+
              '<div class="wnum">'+ecN+'</div></div>'+
              '<div class="ecsum"><span class="det">'+ecDone+' of '+ecEl+
              ' days · since '+esc(shortDate(EC_START))+'</span>'+
              '<span class="apct'+(ecPct>=MONTH_TARGET?" on":"")+'">'+ecPct.toFixed(0)+'%</span></div>'+
              '<div class="bar" style="margin-top:14px">'+
              '<i style="width:'+Math.min(100,(ecEl/ecTotal)*100)+'%"></i></div>'+
              '<div class="sub">Day '+Math.min(ecEl,ecTotal)+' of '+ecTotal+' in the cycle</div>'+
              '<div class="note">Optional, so it is not graded and does not count toward the '+
              'percentages above. One chapter a day, 1 through 6 on repeat, with a new question '+
              'each time a chapter comes back around.</div></section>';
    }
  }

  app.innerHTML = html;
  wire();
}

function wire(){
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      page = b.dataset.page; statusMsg="";
      var n0 = parseKey(keyOf()); viewY = n0.y; viewM = n0.m;
      render();
    };
  });
  ["mPrev","mNext"].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ viewY = Number(b.dataset.y); viewM = Number(b.dataset.m); render(); };
  });
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  if(prev) prev.onclick = function(){ flush(); viewDay = Math.max(1, viewDay-1); statusMsg=""; render(); };
  if(next) next.onclick = function(){ flush(); viewDay = Math.min(PLAN.length, viewDay+1); statusMsg=""; render(); };
  var jn = document.getElementById("jumpNext");
  if(jn) jn.onclick = function(){ flush(); viewDay = nextUnloggedDay(); statusMsg=""; render(); };

  document.querySelectorAll("[data-goto]").forEach(function(b){
    b.onclick = function(){ flush(); viewDay = Number(b.dataset.goto); statusMsg=""; render(); };
  });

  document.querySelectorAll("textarea[data-q],textarea[data-x]").forEach(function(t){
    t.oninput = function(){
      statusMsg = "Saving\u2026"; statusErr = false; paintStatus();
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ writeDraft(); }, 700);
    };
    t.onblur = function(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } writeDraft(); };
  });

  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick = function(){
      var seg = b.parentNode, was = b.classList.contains("sel");
      seg.querySelectorAll("button").forEach(function(x){ x.classList.remove("sel"); });
      if(!was) b.classList.add("sel");
      if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
      writeDraft();
    };
  });

  var sb = document.getElementById("syncBtn");
  if(sb) sb.onclick = function(){
    if(ghToken()){ syncNow(true); } else { syncOpen = true; render(); }
  };
  var sc = document.getElementById("syncCfg");
  if(sc) sc.onclick = function(){ syncOpen = true; render(); };
  var gs = document.getElementById("ghSave");
  if(gs) gs.onclick = function(){
    var v = document.getElementById("ghtok").value.trim();
    if(v){
      try { localStorage.setItem(TOKEN_KEY, v); } catch(e){}
      syncOpen = false; render(); syncNow(true);
    }
  };
  var gh = document.getElementById("ghHelp");
  if(gh) gh.onclick = function(){ syncHelpOpen = !syncHelpOpen; render(); };
  var gd = document.getElementById("ghDel");
  if(gd) gd.onclick = function(){
    try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
    syncOpen = false; render();
  };
  var gc = document.getElementById("ghClose");
  if(gc) gc.onclick = function(){ syncOpen = false; syncHelpOpen = false; render(); };

  var em = document.getElementById("expMd");
  if(em) em.onclick = function(){ download(toMarkdown(), "bible-log.md", "text/markdown"); };
  var ej = document.getElementById("expJson");
  if(ej) ej.onclick = function(){ download(JSON.stringify(state,null,2), "bible-log-backup.json", "application/json"); };
  var im = document.getElementById("imp");
  if(im) im.onclick = function(){ document.getElementById("importer").click(); };
}

function writeDraft(){
  var e = state.entries[viewDay] || { day: viewDay, date: keyOf() };
  var any = false;
  QUESTIONS.forEach(function(q){
    var node = document.querySelector('textarea[data-q="'+q.id+'"]');
    if(!node) return;
    e[q.id] = node.value;
    if(node.value.trim()) any = true;
  });
  TRACKERS.forEach(function(t){
    var seg = document.querySelector('.seg[data-t="'+t.id+'"]');
    if(!seg){ if(e[t.id]) any = true; return; } // inputs not shown for this day — keep stored values
    var sel = seg.querySelector("button.sel");
    if(sel){ e[t.id] = sel.dataset.v; any = true; }
    else delete e[t.id];
  });
  // extra credit is optional: it keeps an entry alive but never counts toward the 3/3
  var xn = document.querySelector('textarea[data-x="ec"]');
  if(!xn){ if((e.ec||"").trim()) any = true; }       // not shown for this day — keep what is stored
  else if(xn.value.trim()){
    e.ec = xn.value; e.ecCh = Number(xn.dataset.ch); e.ecQ = Number(xn.dataset.qi);
    any = true;
  } else { delete e.ec; delete e.ecCh; delete e.ecQ; }
  if(any){
    if(!e.date) e.date = keyOf();
    e.savedAt = new Date().toISOString();
    state.entries[viewDay] = e;
  } else {
    delete state.entries[viewDay];
  }
  save();
  var pill = document.querySelector(".pill");
  if(pill){
    var n = answered(state.entries[viewDay]);
    pill.textContent = n + "/3";
    pill.className = "pill" + (n===3 ? " on" : "");
  }
  var xb = document.getElementById("xcBox");
  if(xb && xn) xb.classList.toggle("done", !!xn.value.trim());
}

function flush(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(document.querySelector("textarea[data-q],textarea[data-x]")) writeDraft();
}

document.getElementById("importer").onchange = function(ev){
  if(ev.target.files && ev.target.files[0]) importFile(ev.target.files[0]);
  ev.target.value = "";
};
window.addEventListener("beforeunload", flush);
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    flush();
    if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; syncNow(false); }
  }
});

function boot(){
  load();
  viewDay = currentDay();
  render();
  syncNow(false);
}

function renderLock(){
  var app = document.getElementById("app");
  app.innerHTML =
    '<div class="lock"><div class="lockcard">'+
    '<div class="eyebrow">Private</div>'+
    '<h1>Reading Log</h1>'+
    '<input type="password" id="gate" autocomplete="off" placeholder="Password">'+
    '<button id="gateGo">Open</button>'+
    '<div class="lockmsg" id="gateMsg"></div>'+
    '<div class="foot" style="opacity:.55;margin-top:16px">'+APP_VER+'</div>'+
    '</div></div>';
  var input = document.getElementById("gate");
  function attempt(){
    if(gateHash(input.value) === GATE_HASH){
      try { sessionStorage.setItem(GATE_KEY, GATE_HASH); } catch(e){}
      boot();
    } else {
      document.getElementById("gateMsg").textContent = "That's not it.";
      input.value = ""; input.focus();
    }
  }
  document.getElementById("gateGo").onclick = attempt;
  input.onkeydown = function(ev){ if(ev.key === "Enter") attempt(); };
  input.focus();
}

if(isUnlocked()) boot(); else renderLock();
buildThemePanel();
expiryBanner();
</script>
</body>
</html>
